<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pipeflow – Kanäle verbinden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #000000;
    --stone: #666666;
    --rule: #E3E3E3;
    --wash: #F5F5F5;
    --go: #137A3F;
    --stop: #B42318;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--font); }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button { font: inherit; color: inherit; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Kopfzeile ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 32px; border-bottom: 1px solid var(--rule); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; text-decoration: none; letter-spacing: -0.01em; }
  .brand svg { display: block; }
  .help { font-size: 14px; color: var(--stone); }
  .help a { color: var(--ink); }
  .help .short { display: none; }

  .demo { background: var(--wash); border-bottom: 1px solid var(--rule); padding: 10px 32px; font-size: 14px; color: var(--stone); }

  /* ---------- Layout ---------- */
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 72px; max-width: 1040px; margin: 0 auto; padding: 64px 32px 120px; }

  /* ---------- Die Pipeline (Fortschritt) ---------- */
  .rail { position: sticky; top: 40px; align-self: start; }
  .rail ol { list-style: none; margin: 0; padding: 0; }
  .rail li { position: relative; padding-bottom: 40px; }
  .rail li:last-child { padding-bottom: 0; }
  .pipe { position: absolute; left: 5px; top: 16px; bottom: 0; width: 4px; background: var(--rule); overflow: hidden; }
  .pipe i { display: block; width: 100%; height: 100%; background: var(--ink); transform: scaleY(0); transform-origin: top; transition: transform .7s steps(7, end); }
  .pipe.full i { transform: none; }
  .node { display: grid; grid-template-columns: 14px 1fr; column-gap: 16px; align-items: start; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .node:disabled { cursor: default; }
  .sq { width: 14px; height: 14px; margin-top: 5px; border: 2px solid var(--ink); background: var(--paper); position: relative; z-index: 1; }
  .is-done .sq { background: var(--ink); }
  .is-current .sq { background: var(--ink); box-shadow: inset 0 0 0 2px var(--paper); }
  .node .lbl { font-size: 15px; font-weight: 500; }
  .is-current .lbl { font-weight: 700; }
  .is-todo .lbl { color: var(--stone); }
  .node .meta { grid-column: 2; font-size: 13px; color: var(--stone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node:not(:disabled):hover .lbl { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Inhalt ---------- */
  .stage { max-width: 580px; }
  h1 { font-size: 44px; line-height: 1.08; letter-spacing: -0.025em; font-weight: 700; margin: 0 0 16px; }
  h2 { font-size: 20px; letter-spacing: -0.01em; margin: 48px 0 16px; }
  h3 { font-size: 16px; margin: 0 0 4px; }
  .lede { font-size: 19px; line-height: 1.5; color: var(--stone); margin: 0 0 40px; max-width: 34em; }
  p { margin: 0 0 12px; }

  .banner { display: grid; grid-template-columns: 10px 1fr; gap: 14px; align-items: start; padding: 14px 16px; margin: 0 0 32px; border: 1px solid var(--rule); font-size: 15px; }
  .banner::before { content: ""; width: 10px; height: 10px; margin-top: 6px; background: var(--ink); }
  .banner.ok::before { background: var(--go); }
  .banner.bad { border-color: var(--stop); }
  .banner.bad::before { background: var(--stop); }

  /* Formular */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .field { margin-bottom: 22px; }
  .field label, .field legend { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field .opt { color: var(--stone); font-weight: 400; }
  .field .hint { font-size: 13px; color: var(--stone); margin: 6px 0 0; }
  .ai-box { background: var(--wash); border: 1px solid var(--rule); border-radius: 2px; padding: 14px 16px; margin-top: 10px; font-size: 14.5px; }
  .ai-box p { margin: 0 0 12px; white-space: pre-wrap; }
  .ai-box .row { display: flex; gap: 10px; }
  .ai-box button { min-height: 36px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 2px; background: var(--ink); color: var(--paper); cursor: pointer; font-size: 13.5px; }
  .ai-box button.ghost { background: var(--paper); color: var(--ink); }
  .ai-box button[disabled] { opacity: .6; pointer-events: none; }

  .intro { margin: 0 0 40px; padding: 24px 0 32px; border-bottom: 1px solid var(--rule); }
  .intro-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 0 0 20px; }
  .intro-steps div { font-size: 14.5px; line-height: 1.4; }
  .intro-steps .n { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-bottom: 10px; border: 2px solid var(--ink); font-weight: 700; font-size: 13px; }
  .intro-trial { margin: 0; font-size: 15px; font-weight: 500; }
  @media (max-width: 640px) { .intro-steps { grid-template-columns: 1fr; } }

  .lp-square { width: 140px; height: 140px; border-radius: 2px; position: relative; overflow: hidden; margin: 10px 0; background: #0a0e1a; }
  .lp-headline { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); max-width: 68%; color: #fff; font-family: Georgia, "Times New Roman", serif; font-size: 13px; line-height: 1.3; }
  .lp-watermark { position: absolute; right: 5px; bottom: 6px; writing-mode: vertical-rl; color: rgba(255,255,255,.45); font-family: Georgia, "Times New Roman", serif; font-size: 9px; letter-spacing: .05em; max-height: 110px; overflow: hidden; }

  .formpart-nav { display: flex; gap: 12px; margin-top: 32px; }
  .steplabel { font-size: 13px; color: var(--stone); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }

  .dash-status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid var(--ink); border-radius: 20px; font-size: 13.5px; font-weight: 500; margin-bottom: 24px; }
  .dash-status.warn { border-color: var(--stop); color: var(--stop); }
  .needs-action { padding: 12px 16px; background: #FDF2E0; border: 1px solid #E8C468; border-radius: 2px; font-size: 14px; margin-bottom: 24px; }
  .needs-action a, .needs-action button.link { font-weight: 600; }

  .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 16px 0 8px; }
  .post-grid img, .post-grid .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; background: var(--wash); display: block; }

  .approval-card { display: flex; gap: 16px; border: 1px solid var(--rule); border-radius: 2px; padding: 16px; margin-bottom: 12px; }
  .approval-card img, .approval-card .ph { width: 96px; height: 96px; object-fit: cover; border-radius: 2px; background: var(--wash); flex: none; }
  .approval-card .approval-body { flex: 1; min-width: 0; }
  .approval-card .approval-body p { color: var(--stone); font-size: 14px; }
  .channel-badge { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border: 1px solid var(--ink); border-radius: 20px; font-size: 11.5px; font-weight: 500; letter-spacing: .02em; }
  .channel-badge.warn { border-color: var(--stop); color: var(--stop); }

  /* ---------- Dashboard (Panel v6, Aufgabe 3) ---------- */
  .shell.no-rail { grid-template-columns: minmax(0, 1fr); }
  .shell.no-rail .rail { display: none; }
  .dash-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
  .dash-tile { display: flex; flex-direction: column; gap: 4px; min-height: 64px; padding: 16px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
  .dash-tile:hover { border-color: var(--ink); background: var(--wash); }
  .dash-tile-lbl { font-weight: 600; font-size: 15px; }
  .dash-tile-sub { font-size: 13px; color: var(--stone); }
  .dash-channels { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 24px; }
  .dash-channel-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 12px 16px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
  .dash-channel-row:hover { border-color: var(--ink); background: var(--wash); }
  @media (max-width: 720px) { .dash-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .dash-tiles { grid-template-columns: 1fr; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { min-height: 32px; padding: 4px 14px; border: 1px solid var(--ink); border-radius: 20px; background: var(--paper); color: var(--ink); cursor: pointer; font-size: 13.5px; text-align: left; }
  .chip:hover { background: var(--wash); }

  .preview-days { display: flex; gap: 6px; overflow-x: auto; margin: 16px 0; padding-bottom: 4px; }
  .preview-day { flex: 1 0 68px; min-width: 68px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); color: var(--ink); cursor: pointer; font: inherit; }
  .preview-day.is-selected { border-color: var(--ink); background: var(--wash); }
  .preview-day-label { font-size: 12px; text-transform: capitalize; }
  .preview-day-dots { display: flex; gap: 3px; min-height: 8px; }
  .preview-day-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .preview-card { display: flex; gap: 16px; border: 1px solid var(--rule); border-radius: 2px; padding: 16px; margin-bottom: 14px; }
  .preview-card-media img, .preview-card-media .ph { width: 120px; height: 120px; object-fit: cover; border-radius: 2px; background: var(--wash); flex: none; }
  .preview-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .preview-card-body textarea { min-height: 90px; }
  .preview-card-body .swatches { margin: 4px 0; align-items: center; }
  @media (max-width: 480px) { .preview-card { flex-direction: column; } .preview-card-media img, .preview-card-media .ph { width: 100%; height: auto; aspect-ratio: 1; } }
  .approval-card .actions { margin-top: 10px; }
  @media (max-width: 480px) { .approval-card { flex-direction: column; } .approval-card img, .approval-card .ph { width: 100%; height: auto; aspect-ratio: 1; } }

  .cal { margin: 16px 0 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid .hd { font-size: 11px; color: var(--stone); text-align: center; padding-bottom: 4px; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12.5px; border: 1px solid var(--rule); border-radius: 2px; gap: 3px; }
  .cal-day.today { border-color: var(--ink); font-weight: 700; }
  .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-day .dot.posted { background: var(--ink); }
  .cal-day .dot.planned { border: 1px solid var(--stone); background: none; }
  .cal-legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--stone); margin-top: 8px; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend .dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-legend .dot.posted { background: var(--ink); }
  .cal-legend .dot.planned { border: 1px solid var(--stone); }
  input[type=text], input[type=email], input[type=url], input[type=time], select, textarea {
    width: 100%; height: 48px; padding: 0 14px; border: 1px solid #C9C9C9; border-radius: 2px; background: var(--paper); font: inherit; color: inherit;
  }
  textarea { height: auto; min-height: 120px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: 2px solid var(--ink); outline-offset: 0; }
  [aria-invalid=true] { border-color: var(--stop) !important; }
  .err { color: var(--stop); font-size: 13px; margin: 6px 0 0; }
  fieldset { border: 0; padding: 0; margin: 0; }
  .seg { display: flex; gap: 8px; }
  .seg label { flex: 1; margin: 0; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; }
  .seg span { display: block; text-align: center; padding: 13px 8px; font-size: 15px; cursor: pointer; border: 1px solid #C9C9C9; border-radius: 2px; transition: border-color .15s, background .15s; }
  .seg span:hover { border-color: var(--ink); }
  .seg input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
  .seg.wd span { padding: 10px 4px; font-size: 13.5px; }
  @media (max-width: 480px) { .seg.wd { flex-wrap: wrap; } .seg.wd label { flex: 1 1 40px; } }
  .check { display: grid; grid-template-columns: 22px 1fr; gap: 12px; font-size: 14px; color: var(--stone); margin: 8px 0 32px; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink); }

  /* Buttons */
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 32px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px; border: 2px solid var(--ink); border-radius: 2px; background: var(--ink); color: var(--paper); font-size: 16px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .btn:hover { background: var(--paper); color: var(--ink); }
  .btn[disabled], .btn[aria-disabled=true] { background: var(--wash); border-color: var(--rule); color: var(--stone); cursor: not-allowed; }
  .btn.busy { opacity: .7; pointer-events: none; }
  .link { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15px; }
  .fine { font-size: 14px; color: var(--stone); margin-top: 16px; }

  /* Anleitung */
  .guide { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .guide li { display: grid; grid-template-columns: 36px 1fr; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .guide .n { width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--ink); font-size: 14px; font-weight: 700; }
  .guide p { color: var(--stone); margin: 0 0 8px; font-size: 15px; }
  .guide a { font-size: 15px; font-weight: 500; }

  .notice { font-size: 15px; padding-left: 16px; border-left: 4px solid var(--ink); margin: -16px 0 32px; }

  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 18px 20px; background: var(--wash); margin: 0 0 8px; }
  .status .dot { width: 10px; height: 10px; background: var(--go); flex: none; }
  .status.warn .dot { background: var(--stop); }
  .status .who { flex: 1; min-width: 180px; }
  .status small { display: block; color: var(--stone); font-size: 13px; }

  details { border-bottom: 1px solid var(--rule); }
  details:first-of-type { border-top: 1px solid var(--rule); }
  summary { padding: 16px 0; cursor: pointer; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-weight: 400; font-size: 20px; line-height: 1; }
  details[open] summary::after { content: "–"; }
  details p { color: var(--stone); font-size: 15px; padding-bottom: 12px; }

  /* Zusammenfassung */
  dl.sum { margin: 0; border-top: 1px solid var(--rule); }
  dl.sum div { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  dl.sum dt { color: var(--stone); font-size: 15px; }
  dl.sum dd { margin: 0; }
  .copyrow { display: flex; gap: 8px; margin-top: 12px; }
  .copyrow input { font-size: 14px; }
  .copyrow .btn { min-height: 48px; padding: 0 18px; flex: none; }

  input[type=color] { -webkit-appearance: none; appearance: none; width: 48px; height: 48px; padding: 0; border: 1px solid #C9C9C9; border-radius: 2px; cursor: pointer; background: none; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 4px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 1px; }
  .colorrow { display: flex; align-items: center; gap: 14px; }
  .colorrow input[type=text] { flex: 1; }
  .swatches { display: flex; gap: 8px; margin-top: 10px; }

  .theme-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .theme-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 20px; text-decoration: none !important; }
  .theme-chip[disabled] { border-color: var(--ink); font-weight: 600; cursor: default; }
  .theme-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--rule); flex: none; }
  .pillar-row { display: grid; grid-template-columns: 1fr 1.4fr 64px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .pillar-row input, .pillar-row select { height: 40px; padding: 0 10px; border: 1px solid #C9C9C9; border-radius: 2px; background: var(--paper); font: inherit; }
  @media (max-width: 640px) { .pillar-row { grid-template-columns: 1fr; } }
  .swatch { width: 28px; height: 28px; border: 1px solid var(--rule); cursor: pointer; padding: 0; }
  .swatch[aria-pressed=true] { outline: 2px solid var(--ink); outline-offset: 2px; }

  .history { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .history li { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .history img, .history-ph { width: 64px; height: 64px; object-fit: cover; background: var(--wash); }
  .history .cap { font-size: 15px; }
  .history .cap strong { display: block; margin-bottom: 2px; }
  .history .cap span { color: var(--stone); font-size: 13px; }
  .history time { font-size: 13px; color: var(--stone); white-space: nowrap; }
  .empty { padding: 40px 0; color: var(--stone); font-size: 15px; }

  /* ---------- Bild-Vorschauen antippen zum Vergroessern ---------- */
  [data-lightbox] { cursor: zoom-in; }
  .lightbox-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.86); display: grid; place-items: center; padding: 24px; }
  .lightbox-overlay[hidden] { display: none; }
  .lightbox-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; }
  .lightbox-close { position: fixed; top: 16px; right: 16px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
  .lightbox-close:hover { background: rgba(255,255,255,.3); }

  /* ---------- Horizontal scrollende 7-Tage-Reiter: Hinweis auf Mobil ---------- */
  .preview-hint { display: none; font-size: 12.5px; color: var(--stone); margin: -10px 0 14px; }

  .trialbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 20px; background: var(--ink); color: var(--paper); font-size: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .trialbar.ended { background: var(--stop); }
  .trialbar a.btn2 { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 16px; border: 1px solid var(--paper); border-radius: 2px; background: transparent; color: var(--paper); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .trialbar a.btn2:hover { background: var(--paper); color: var(--ink); }

  .overlay { position: fixed; inset: 0; background: rgba(255,255,255,.94); display: grid; place-items: center; font-size: 18px; font-weight: 500; z-index: 10; }
  .loading { color: var(--stone); padding: 40px 0; }

  /* ---------- Mobil ---------- */
  @media (max-width: 820px) {
    .top { padding: 0 20px; height: 60px; }
    .help .long { display: none; }
    .help .short { display: inline; }
    .demo { padding: 10px 20px; }
    .shell { grid-template-columns: 1fr; gap: 36px; padding: 28px 20px 96px; }
    .rail { position: static; }
    .rail ol { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
    .rail li { padding-bottom: 0; }
    .pipe { left: 14px; right: 0; top: 5px; bottom: auto; width: auto; height: 4px; }
    .pipe i { transform: scaleX(0); transform-origin: left; }
    .node { grid-template-columns: 14px; row-gap: 8px; }
    .sq { margin-top: 0; }
    .node .lbl { grid-column: 1 / -1; font-size: 12px; white-space: nowrap; }
    .node .meta { display: none; }
    h1 { font-size: 32px; }
    .lede { font-size: 17px; margin-bottom: 32px; }
    .grid2 { grid-template-columns: 1fr; }
    .btn { width: 100%; }
    .actions { flex-direction: column; align-items: stretch; text-align: center; }
    .formpart-nav { flex-direction: column; }
    dl.sum div { grid-template-columns: 1fr; gap: 2px; }

    /* Tap-Ziele auf Mobil mindestens ca. 44x44px, wie bei mobilen Oberflaechen ueblich. */
    .link { display: inline-flex; align-items: center; min-height: 44px; }
    .chip { min-height: 44px; }
    .pillar-row input, .pillar-row select { height: 44px; }
    .pillar-row .link { justify-content: center; }
    .swatch { width: 36px; height: 36px; }
    .swatches { gap: 12px; }
    .seg.wd span { padding: 12px 4px; }
    .preview-hint { display: block; }

    /* Verlauf: Zeit unter statt neben dem Text - sonst zu eng auf schmalen Screens. */
    .history li { grid-template-columns: 56px 1fr; row-gap: 4px; }
    .history img, .history-ph { width: 56px; height: 56px; }
    .history time { grid-column: 2; white-space: normal; }
  }

  @media (max-width: 380px) {
    .cal-grid { gap: 2px; }
    .cal-day { font-size: 11px; }
  }

  /* ---------- Intro-Splash ---------- */
  /* pointer-events:none from the start (not just after JS cleanup) - the splash is purely
     decorative and must never be able to block the panel underneath, even if JS fails to run
     the cleanup below for any reason. The panels/text still visually cover the screen via CSS
     animation alone (no JS needed for that part). */
  #splash { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
  #splash.splash-done { opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .splash-panel { position: fixed; top: 0; bottom: 0; width: 50%; background: var(--paper); }
  .splash-left { left: 0; animation: splashOpenLeft 1.4s cubic-bezier(.6,0,.2,1) both; }
  .splash-right { right: 0; animation: splashOpenRight 1.4s cubic-bezier(.6,0,.2,1) both; }
  .splash-content { position: fixed; top: 50%; left: 50%; z-index: 2; text-align: center; pointer-events: none; animation: splashText 1.4s cubic-bezier(.2,.8,.2,1) both; }
  .splash-word { font: 700 clamp(2.4rem, 11vw, 4.75rem)/1 var(--font); letter-spacing: -.01em; color: var(--ink); }
  .splash-sub { margin-top: 10px; font-size: clamp(.7rem, 2.6vw, .95rem); color: var(--stone); letter-spacing: .02em; }
  @keyframes splashOpenLeft { 0%, 60% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  @keyframes splashOpenRight { 0%, 60% { transform: translateX(0); } 100% { transform: translateX(100%); } }
  @keyframes splashText {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.85); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    55% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    68%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.04); }
  }

  @media (prefers-reduced-motion: reduce) {
    .pipe i { transition: none; }
    .splash-panel, .splash-content { animation: none; }
    .splash-content { opacity: 1; transform: translate(-50%, -50%); }
  }
</style>
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="splash-panel splash-left"></div>
  <div class="splash-panel splash-right"></div>
  <div class="splash-content">
    <div class="splash-word">Pipeflow</div>
    <div class="splash-sub">Powered by Pipeline AI Solutions</div>
  </div>
</div>
<script>
  (function () {
    // Runs on every full load/reload, on purpose (no sessionStorage flag) - purely visual, never
    // delays or blocks the real page/app below it (init() further down runs independently).
    var splash = document.getElementById("splash");
    if (!splash) return;
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var holdMs = reduced ? 300 : 1500;
    setTimeout(function () {
      splash.classList.add("splash-done");
      setTimeout(function () { splash.remove(); }, 350);
    }, holdMs);
  })();
</script>

<script>
(() => {
  /* ================= Einstellungen ================= */
  const CONFIG = {
    mount: "/panel",
    privacyUrl: "https://pipebot.at/datenschutz",     // TODO: echte Datenschutzerklärung verlinken
    nextSteps: "Wir sehen uns Ihre Angaben an und melden uns per E-Mail, bevor der erste Beitrag online geht.",
  };
  const DEMO = !location.pathname.startsWith(CONFIG.mount) || new URLSearchParams(location.search).has("demo");

  const TONES = { sachlich: "Sachlich und kompetent", locker: "Locker und nahbar", inspirierend: "Inspirierend", humorvoll: "Mit Humor" };
  const FREQ = { "3x-woche": "3× pro Woche", werktags: "Werktags", taeglich: "Täglich" };
  const WEEKDAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const FREQ_WEEKDAYS = { "3x-woche": [1, 3, 5], werktags: [1, 2, 3, 4, 5], taeglich: [1, 2, 3, 4, 5, 6, 7] };
  // Pre-fills the weekday picker from an explicit "1,3,5"-style value if the customer already
  // has one, otherwise derives it from the legacy `frequency` radio choice - so the old and new
  // controls are never shown/edited at the same time, only one replaces the other on load.
  const weekdaysFor = (explicit, frequency) => {
    if (explicit) return explicit.split(",").map(Number).filter((n) => n >= 1 && n <= 7);
    return FREQ_WEEKDAYS[frequency] || FREQ_WEEKDAYS.werktags;
  };
  const classifyFrequency = (days) => {
    const key = [...days].sort((a, b) => a - b).join(",");
    if (key === "1,2,3,4,5,6,7") return "taeglich";
    if (key === "1,3,5") return "3x-woche";
    return "werktags";
  };
  const CTAS = { link_bio: "Link in der Bio", anrufen: "Anrufen", nachricht: "Nachricht senden", termin: "Termin buchen", keiner: "Kein Aufruf" };
  const HASHTAGS = { keine: "Keine", wenige: "Wenige (2-3)", viele: "Viele (5+)" };
  const LANGUAGES = { de: "Deutsch", en: "Englisch" };
  const PALETTE = ["#0a0e1a", "#1a2e1a", "#2e1a1a", "#1a1a2e", "#2e2410", "#111111"];

  const ERRORS = {
    cancelled: (n) => `Sie haben die Verbindung mit ${n} abgebrochen. Sie können es jederzeit erneut versuchen.`,
    state: () => "Die Anfrage ist abgelaufen. Bitte klicken Sie noch einmal auf Verbinden.",
    personal_account: () => "Ihr Instagram-Konto ist noch ein privates Konto. Stellen Sie es zuerst auf ein professionelles Konto um (Punkt 1) und verbinden Sie dann erneut.",
    missing_permission: (n) => `Die Freigabe zum Veröffentlichen fehlt. Bitte verbinden Sie ${n} erneut und bestätigen Sie alle Berechtigungen.`,
    not_configured: (n) => `Die Verbindung mit ${n} ist gerade nicht verfügbar. Schreiben Sie uns kurz, wir kümmern uns darum.`,
    failed: (n) => `Die Verbindung mit ${n || "der Plattform"} hat nicht geklappt. Bitte versuchen Sie es erneut oder schreiben Sie uns.`,
    login: () => "Dieser Zugangslink ist ungültig oder wurde durch einen neueren ersetzt.",
    session: () => "Bitte geben Sie zuerst Ihre Unternehmensdaten ein.",
    verify: () => "Dieser Bestätigungslink ist ungültig oder wurde bereits verwendet.",
  };

  /* ================= Zustand ================= */
  const S = { providers: [], aiAvailable: false, trialDays: 7, turnstileSiteKey: null, customer: null, connections: [], step: "company", formPart: 1, banner: null, skipped: new Set(), pillarAiOpen: false, pillarAiKeywords: "", pillarSuggestions: [] };

  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const conn = (id) => S.connections.find((c) => c.provider === id);
  const prov = (id) => S.providers.find((p) => p.id === id);
  const steps = () => ["company", ...S.providers.map((p) => p.id), "done", "preview", "history"];
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("de-AT", { day: "numeric", month: "long", year: "numeric" }) : "";
  const fmtNextPost = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    const weekday = d.toLocaleDateString("de-AT", { weekday: "long", timeZone: "Europe/Vienna" });
    const time = d.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Vienna" });
    return `${weekday}, ${time} Uhr`;
  };

  /* ================= API ================= */
  async function api(method, url, body) {
    if (DEMO) return mockApi(method, url, body);
    const res = await fetch(CONFIG.mount + url, {
      method, credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "Unbekannter Fehler"), { status: res.status, fields: data.fields });
    return data;
  }
  const applyState = (d) => { S.customer = d.customer; S.connections = d.connections || []; };

  /* ================= Rendering: Pipeline ================= */
  function renderRail() {
    // Panel v6 Aufgabe 3: die Schritt-Kette bleibt fuer den Erst-Assistenten unveraendert (siehe
    // unten), zeigt sich aber gar nicht erst, sobald das neue Dashboard der Landepunkt ist - dort
    // uebernehmen die Dashboard-Kacheln die Navigation.
    if (S.step === "dashboard") { $("#rail").innerHTML = ""; return; }
    const list = steps();
    const cur = list.indexOf(S.step);
    const label = (id) => id === "company" ? "Unternehmen" : id === "done" ? "Fertig" : id === "preview" ? "Vorschau" : id === "history" ? "Verlauf" : prov(id).name;
    const meta = (id) => {
      if (id === "company") return S.customer ? S.customer.company : "Angaben machen";
      if (id === "done" || id === "preview" || id === "history") return "";
      const c = conn(id);
      if (c) return c.status === "expired" ? "Abgelaufen" : c.accountName;
      return S.skipped.has(id) ? "Übersprungen" : "Nicht verbunden";
    };
    const isDone = (id) => id === "company" ? !!S.customer : (id === "done" || id === "preview" || id === "history") ? false : !!conn(id) && conn(id).status !== "expired";

    $("#rail").innerHTML = list.map((id, i) => {
      const state = id === S.step ? "is-current" : isDone(id) ? "is-done" : "is-todo";
      const reachable = S.customer || id === "company";
      const full = i < cur && (isDone(id) || S.skipped.has(id));
      return `<li class="${state}">
        ${i < list.length - 1 ? `<span class="pipe${full ? " full" : ""}"><i></i></span>` : ""}
        <button class="node" data-go="${id}" ${reachable ? "" : "disabled"} ${id === S.step ? 'aria-current="step"' : ""}>
          <span class="sq" aria-hidden="true"></span><span class="lbl">${esc(label(id))}</span><span class="meta">${esc(meta(id))}</span>
        </button></li>`;
    }).join("");
  }

  /* ================= Farbthemen ================= */
  function themesSectionHtml(c) {
    const themes = c.savedThemes || [];
    const activeName = themes.find((t) => t.id === c.activeThemeId)?.name;
    return `
      <label>Gespeicherte Farbthemen <span class="opt">(optional)</span></label>
      ${c.activeThemeId ? `<p class="hint">Aktives Thema: <strong>${esc(activeName || "")}</strong> - <button type="button" class="link" id="theme-deactivate">stattdessen eigene Farbe oben verwenden</button></p>` : ""}
      ${themes.length ? `<div class="theme-list">${themes.map((t) => `<button type="button" class="link theme-chip" data-theme-activate="${esc(t.id)}" ${c.activeThemeId === t.id ? "disabled" : ""}><span class="theme-dot" style="background:${esc(t.accentColor || "#0a0e1a")}"></span>${esc(t.name)}${c.activeThemeId === t.id ? " (aktiv)" : ""}</button>`).join("")}</div>` : ""}
      <button type="button" class="link" id="theme-save">+ Aktuelle Farbe/Beschriftung als Thema speichern</button>`;
  }

  /* ================= Logo ================= */
  function logoSectionHtml(c) {
    return `
      <label for="f-logo">Eigenes Logo <span class="opt">(optional, PNG oder JPG, max. 2 MB)</span></label>
      <p class="hint">Wird klein am Bildrand angezeigt und ersetzt dort die Text-Beschriftung - kein Vollbild-Logo.</p>
      <div id="logo-preview">${c.hasLogo ? `<img src="${DEMO && MOCK.logoDataUrl ? MOCK.logoDataUrl : `${CONFIG.mount}/api/logo?t=${Date.now()}`}" alt="Ihr Logo" style="width:64px;height:64px;object-fit:contain;background:var(--wash);border-radius:2px">` : ""}</div>
      <input type="file" id="f-logo" accept="image/png,image/jpeg">
      <div class="actions" style="margin-top:10px">
        <button type="button" class="link" id="logo-upload" disabled>Logo hochladen</button>
        ${c.hasLogo ? `<button type="button" class="link" id="logo-remove" style="color:var(--stop)">Logo entfernen</button>` : ""}
      </div>`;
  }

  /* ================= Content-Säulen ================= */
  function pillarSuggestionCardHtml(p, i) {
    return `<div class="ai-box" data-pillar-suggestion="${i}">
      <p><strong>${esc(p.title)}</strong><br>${esc(p.description)}</p>
      <div class="row">
        <button type="button" data-pillar-accept="${i}" ${S.pillarsDraft.length >= 6 ? "disabled" : ""}>Übernehmen</button>
        <button type="button" class="ghost" data-pillar-discard="${i}">Verwerfen</button>
      </div>
    </div>`;
  }

  function renderPillarsSection() {
    const rows = S.pillarsDraft.map((p, i) => `
      <div class="pillar-row" data-pillar-index="${i}">
        <input type="text" data-pillar-title placeholder="z. B. Tipps" value="${esc(p.title)}" maxlength="60" aria-label="Titel der Säule">
        <input type="text" data-pillar-desc placeholder="Worum geht es dabei? (optional)" value="${esc(p.description)}" maxlength="300" aria-label="Beschreibung der Säule">
        <select data-pillar-weight aria-label="Gewichtung">${[1, 2, 3, 4, 5].map((w) => `<option value="${w}" ${p.weight === w ? "selected" : ""}>${w}×</option>`).join("")}</select>
        <button type="button" class="link" data-pillar-remove="${i}">Entfernen</button>
      </div>`).join("");
    return `
      <label>Content-Säulen <span class="opt">(optional)</span></label>
      <p class="hint">Wiederkehrende Themen, zwischen denen automatisch abgewechselt wird (z. B. "Tipps", "Hinter den Kulissen", "Kundenstimmen"). Gewicht = wie oft im Vergleich zu den anderen dran. Ohne Säulen nutzen wir einfach Ihre Beschreibung oben.</p>
      <div id="pillars-list">${rows}</div>
      ${S.pillarsDraft.length < 6 ? `<button type="button" class="link" id="pillar-add">+ Säule hinzufügen</button>` : `<p class="hint">Maximal 6 Säulen.</p>`}
      ${S.aiAvailable ? `
      <p class="hint"><button type="button" class="link" id="pillar-ai-suggest">Mit KI vorschlagen</button></p>
      <div id="pillar-ai-block" ${S.pillarAiOpen ? "" : "hidden"}>
        <div class="field">
          <label for="f-pillar-keywords" class="vh">Stichworte für Themen-Ideen</label>
          <input id="f-pillar-keywords" type="text" placeholder="Stichworte für Themen-Ideen (optional, z. B. Osteopressur, Faszientherapie, Mühlviertel)" maxlength="300" value="${esc(S.pillarAiKeywords)}">
        </div>
        <div class="actions">
          <button type="button" class="link" id="pillar-ai-fetch">Vorschläge holen</button>
        </div>
        <div id="pillar-ai-results">${S.pillarSuggestions.map(pillarSuggestionCardHtml).join("")}</div>
      </div>` : ""}`;
  }

  function syncPillarsDraftFromDom() {
    const rows = document.querySelectorAll(".pillar-row");
    if (!rows.length && !S.pillarsDraft.length) return;
    const next = [];
    rows.forEach((row) => {
      next.push({
        title: row.querySelector("[data-pillar-title]")?.value || "",
        description: row.querySelector("[data-pillar-desc]")?.value || "",
        weight: Number(row.querySelector("[data-pillar-weight]")?.value) || 1,
      });
    });
    S.pillarsDraft = next;
  }

  /* ================= Rendering: Schritte ================= */
  function bannerHtml() {
    if (!S.banner) return "";
    return `<div class="banner ${S.banner.kind}" role="${S.banner.kind === "bad" ? "alert" : "status"}">${esc(S.banner.text)}</div>`;
  }

  function companyHtml() {
    const c = S.customer || {
      tone: "sachlich", frequency: "werktags", postTime: "15:00", accentColor: "", watermarkText: "", avoidTopics: "", ctaPreference: "link_bio",
      igFeedEnabled: true, igStoryEnabled: true, linkedinEnabled: true, hashtagPreference: "wenige", emojisEnabled: true, language: "de",
      contentPillars: [],
    };
    S.pillarsDraft = (c.contentPillars || []).map((p) => ({ title: p.title || "", description: p.description || "", weight: p.weight || 1 }));
    const edit = !!S.customer;
    const twoPart = !edit; // Beim Bearbeiten alles auf einer Seite - der Kunde kennt das Formular schon.
    const part = twoPart ? S.formPart : 1;
    const f = (name, label, type, opts = {}) => `
      <div class="field">
        <label for="f-${name}">${label}${opts.optional ? ' <span class="opt">(optional)</span>' : ""}</label>
        <input id="f-${name}" name="${name}" type="${type}" value="${esc(c[name])}" ${opts.optional ? "" : "required"} autocomplete="${opts.ac || "off"}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ""}>
      </div>`;

    const introHtml = !edit ? `
      <div class="intro" id="intro-block" ${part !== 1 ? "hidden" : ""}>
        <div class="intro-steps">
          <div><span class="n">1</span>Angaben zu Ihrem Unternehmen machen</div>
          <div><span class="n">2</span>Instagram und/oder LinkedIn verbinden</div>
          <div><span class="n">3</span>Fertig - Beiträge erscheinen von selbst</div>
        </div>
        <p class="intro-trial">${S.trialDays} Tage kostenlos testen. Keine Kreditkarte nötig.</p>
      </div>` : "";

    const partAHtml = `
        <div class="grid2">
          ${f("company", "Firmenname", "text", { ac: "organization" })}
          <div class="field">
            <label for="f-website">Website <span class="opt">(optional)</span></label>
            <input id="f-website" name="website" type="url" value="${esc(c.website)}" autocomplete="url" placeholder="https://">
            ${S.aiAvailable ? `<p class="hint"><button type="button" class="link" id="analyze-website">Vorschlag aus meiner Website holen</button></p>` : ""}
          </div>
          ${f("contactName", "Ihr Name", "text", { ac: "name" })}
          ${f("email", "E-Mail", "email", { ac: "email" })}
        </div>
        <div id="website-suggestion" hidden></div>
        ${f("industry", "Branche", "text", { optional: true, ph: "z. B. Physiotherapie, Tischlerei, Steuerberatung" })}
        <div class="field">
          <label for="f-about">Worum soll es in den Beiträgen gehen?</label>
          <textarea id="f-about" name="about" placeholder="z. B. Physiotherapie-Praxis in Linz, Schwerpunkt Rückenschmerzen. Zielgruppe: Büroangestellte zwischen 35 und 60. Wir wollen Tipps geben und neue Patienten gewinnen.">${esc(c.about)}</textarea>
          <p class="hint">Stichworte reichen. Je konkreter, desto besser passen die Beiträge.${S.aiAvailable ? ` <button type="button" class="link" id="ai-improve">Mit KI verbessern</button>` : ""}</p>
          <div id="ai-suggestion" hidden></div>
        </div>
        <div class="field" id="pillars-section">${renderPillarsSection()}</div>`;

    const partBHtml = `
        <div class="field">
          <label for="f-tone">Tonalität</label>
          <select id="f-tone" name="tone">${Object.entries(TONES).map(([k, v]) => `<option value="${k}" ${c.tone === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        </div>
        <div class="grid2">
          <div class="field">
            <label for="f-accentColor">Akzentfarbe für Ihre Bilder <span class="opt">(optional)</span></label>
            <div class="colorrow">
              <input id="f-accentColor" name="accentColor" type="color" value="${esc(c.accentColor || "#0a0e1a")}">
              <input type="text" value="${esc(c.accentColor || "")}" placeholder="Standard" readonly aria-hidden="true" tabindex="-1">
            </div>
            <div class="swatches" role="group" aria-label="Vorschläge">
              ${PALETTE.map((hex) => `<button type="button" class="swatch" data-swatch="${hex}" aria-pressed="${c.accentColor === hex}" style="background:${hex}" aria-label="${hex}"></button>`).join("")}
            </div>
            <p class="hint">Bestimmt den Hintergrund Ihrer generierten Bilder. Leer lassen für unser Standard-Design.${c.activeThemeId ? " <strong>Hinweis: Aktuell wird stattdessen Ihr aktives Thema unten verwendet.</strong>" : ""}</p>
          </div>
          <div class="field">
            <label for="f-watermarkText">Beschriftung im Bild <span class="opt">(optional)</span></label>
            <input id="f-watermarkText" name="watermarkText" type="text" value="${esc(c.watermarkText || "")}" placeholder="${esc(c.company || "Ihr Firmenname")}">
            <p class="hint">Erscheint klein am Bildrand. Leer lassen, um Ihren Firmennamen zu verwenden.</p>
            <p class="hint">So ungefähr sehen Ihre Bilder aus (Beispiel, kein echtes Bild):</p>
            <div class="lp-square" id="lp-square" style="background:${esc(c.accentColor || "#0a0e1a")}">
              <span class="lp-headline" id="lp-headline">Ihr Beitrag</span>
              <span class="lp-watermark" id="lp-watermark">${esc(c.watermarkText || c.company || "Pipeline")}</span>
            </div>
          </div>
        </div>
        ${edit ? `<div class="field" id="themes-section">${themesSectionHtml(c)}</div>` : ""}
        ${edit ? `<div class="field" id="logo-section">${logoSectionHtml(c)}</div>` : ""}
        <fieldset class="field">

  function formPartLabel(part) {
    return `Schritt ${part} von 2 · ${part === 1 ? "Über Sie" : "Ihr Stil"}`;
  }

    return part === 1 ? "Erzählen Sie uns, worum es bei Ihnen geht." : "Wie sollen Ihre Beiträge aussehen und klingen?";

  function formPartActionsHtml(part) {
    return part === 1
      ? `<div class="formpart-nav"><button class="btn" type="button" data-formpart="2">Weiter: Ihr Stil</button></div>`
      : `<div class="formpart-nav"><button class="btn ghost" type="button" data-formpart="1">Zurück</button><button class="btn" type="submit">Weiter zu ${esc(S.providers[0]?.name || "den Kanälen")}</button></div>`;
  }

  /* ================= Cloudflare Turnstile (Panel v6, Aufgabe 2a) ================= */
  // Nur bei tatsaechlich konfiguriertem TURNSTILE_SITE_KEY ueberhaupt geladen/gerendert - ohne
  // Key existiert weder das Skript-Tag noch der Platzhalter-Div (siehe companyHtml()).
  let turnstileScriptRequested = false;
  let turnstileWidgetId = null;
  function loadTurnstileScript(cb) {
    if (window.turnstile) { cb(); return; }
    if (!turnstileScriptRequested) {
      turnstileScriptRequested = true;
      const s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      s.async = true;
      s.defer = true;
      document.head.appendChild(s);
    }
    const check = () => { if (window.turnstile) cb(); else setTimeout(check, 100); };
    check();
  }
  // Explizit statt implizit gerendert (render=explicit + eigener render()-Aufruf hier), weil der
  // Platzhalter-Div erst auf Formular-Seite 2 sichtbar wird - ein automatisches Rendern beim
  // Laden waere noch versteckt (display:none von Seite 1) und wuerde sich nicht zuverlaessig
  // sauber aufbauen. Rendert nur einmal (turnstileWidgetId-Guard), auch wenn der Kunde
  // mehrmals zwischen Seite 1/2 wechselt.
  function renderTurnstileIfNeeded() {
    if (!S.turnstileSiteKey || turnstileWidgetId !== null) return;
    const container = document.getElementById("turnstile-widget");
    if (!container) return;
    loadTurnstileScript(() => {
      if (turnstileWidgetId !== null) return;
      turnstileWidgetId = window.turnstile.render(container, { sitekey: S.turnstileSiteKey });
    });
  }

  /** Switches between the two signup form pages without re-rendering (would wipe unsaved input in the other page). */
  function switchFormPart(n) {
    S.formPart = n;
    const intro = document.getElementById("intro-block");
    if (intro) intro.hidden = n !== 1;
    const a = document.getElementById("formpart-a");
    const b = document.getElementById("formpart-b");
    if (a) a.hidden = n !== 1;
    if (b) b.hidden = n !== 2;
    const label = document.getElementById("steplabel");
    if (label) label.textContent = formPartLabel(n);
    const lede = document.getElementById("lede");
    if (lede) lede.textContent = formPartLede(n);
    const actions = document.getElementById("formpart-actions");
    if (actions) actions.innerHTML = formPartActionsHtml(n);
    if (n === 2) renderTurnstileIfNeeded();
    window.scrollTo({ top: 0 });
    $("#stage")?.focus({ preventScroll: true });
  }

  function providerHtml(p) {
    const c = conn(p.id);
    const list = steps();
    const nextId = list[list.indexOf(p.id) + 1];
    const nextTarget = nextId === "done" ? overviewStep() : nextId;
    const nextName = nextId === "done" ? (nextTarget === "dashboard" ? "Übersicht" : "Zusammenfassung") : prov(nextId).name;
    const connectBtn = (label) => p.available
      ? `<a class="btn" href="${CONFIG.mount}/connect/${p.id}" data-connect="${p.id}">${label}</a>`
      : `<span class="btn" aria-disabled="true">${label}</span>`;

    let statusBox = "";
    if (c) {
      const warn = c.status !== "ok";
      const sub = c.status === "expired" ? "Freigabe abgelaufen, bitte neu verbinden."
        : c.status === "renew-soon" ? `Freigabe läuft am ${fmtDate(c.expiresAt)} ab, bitte bald neu verbinden.`
        : `Verbunden seit ${fmtDate(c.connectedAt)}`;
      statusBox = `
        <div class="status${warn ? " warn" : ""}">
          <span class="dot" aria-hidden="true"></span>
          <div class="who"><strong>${esc(c.accountName)}</strong><small>${sub}</small></div>
          <button class="link" data-disconnect="${p.id}">Trennen</button>
        </div>`;
    }

    return `
      ${bannerHtml()}
      <h1>${esc(p.name)} verbinden</h1>
      <p class="lede">${esc(p.tagline)}</p>
      ${p.notice ? `<p class="notice">${esc(p.notice)}</p>` : ""}
      ${statusBox}
      ${c && c.status === "ok" ? `
        <div class="actions">
          <button class="btn" data-go="${nextTarget}">Weiter zu ${esc(nextName)}</button>
          <a class="link" href="${CONFIG.mount}/connect/${p.id}" data-connect="${p.id}">Anderes Konto verbinden</a>
        </div>` : `
        <h2>So geht's</h2>
        <ol class="guide">${p.guide.map((g, i) => `
          <li><span class="n" aria-hidden="true">${i + 1}</span><div>
            <h3>${esc(g.title)}</h3><p>${esc(g.text)}</p>
            ${g.link ? `<a href="${esc(g.link.url)}" target="_blank" rel="noopener">${esc(g.link.label)}<span class="vh"> (öffnet in neuem Tab)</span></a>` : ""}
          </div></li>`).join("")}
        </ol>
        <div class="actions">
          ${connectBtn(c ? `${esc(p.name)} neu verbinden` : `Mit ${esc(p.name)} verbinden`)}
          <button class="link" data-skip="${p.id}" data-go="${nextTarget}">Später verbinden</button>
        </div>
        <p class="fine">${p.available ? "Wir bekommen nur das Recht, Beiträge zu veröffentlichen. Ihr Passwort sehen wir nie." : "Diese Verbindung ist gerade nicht verfügbar. Schreiben Sie uns, wir schalten sie frei."}</p>
      `}
      <h2>Häufige Fragen</h2>
      <details><summary>Kann ich die Verbindung wieder trennen?</summary><p>Ja, jederzeit mit einem Klick hier im Panel. Danach veröffentlichen wir nichts mehr auf ${esc(p.name)}.</p></details>
      <details><summary>Sehe ich die Beiträge, bevor sie erscheinen?</summary><p>Zum Start stimmen wir Stil und Themen mit Ihnen ab. Danach laufen die Beiträge im gewählten Rhythmus automatisch.</p></details>
      <details><summary>Es kommt eine Fehlermeldung. Was tun?</summary><p>Prüfen Sie, ob Sie mit dem richtigen Konto angemeldet sind, und versuchen Sie es erneut. Klappt es nicht, schreiben Sie an <a href="mailto:office@pipeline-solutions.at">office@pipeline-solutions.at</a>.</p></details>
    `;
  }

  function hasOpenPostRequest(c) {
    return c.lastPostRequest && c.lastPostRequest.status === "pending";
  }

  function postNowStatusHtml(req) {
    if (!req) return "";
    const topicPart = req.topic ? `: "${esc(req.topic)}"` : "";
    return req.status === "pending"
      ? `<div class="banner" role="status">Ausstehend${topicPart} - angefragt am ${esc(fmtDate(req.createdAt))}. Wird in der Regel innerhalb weniger Minuten bearbeitet.</div>`
      : `<div class="banner ok" role="status">Erledigt${topicPart}.</div>`;
  }

  function statusHtml(c) {
    if (c.trialExpired) return `<span class="dash-status warn">Trial abgelaufen</span>`;
    if (c.customerPaused) return `<span class="dash-status warn">Pausiert (von Ihnen)</span>`;
    if (c.trialDaysLeft != null) return `<span class="dash-status">Trial · noch ${c.trialDaysLeft} ${c.trialDaysLeft === 1 ? "Tag" : "Tage"}</span>`;
    return `<span class="dash-status">Aktiv</span>`;
  }

  function needsActionHtml() {
    const bad = S.connections.filter((k) => k.status !== "ok");
    if (!bad.length) return "";
    return `<div class="needs-action">${bad.map((k) => {
      const p = prov(k.provider);
      return k.status === "expired"
        ? `${esc(p?.name || k.provider)}: Freigabe abgelaufen - <a href="${CONFIG.mount}/connect/${k.provider}" data-connect="${k.provider}">jetzt neu verbinden</a>.`
        : `${esc(p?.name || k.provider)}: Freigabe läuft bald ab - <a href="${CONFIG.mount}/connect/${k.provider}" data-connect="${k.provider}">jetzt erneuern</a>.`;
    }).join("<br>")}</div>`;
  }

  // Panel v6 Aufgabe 2b: solange email_verified false ist, keine KI-Generierung (Server lehnt
  // ohnehin ab) - hier nur die dazugehoerige, klare Anzeige mit Resend-Moeglichkeit. Kanäle
  // verbinden bleibt ausdrücklich möglich (kostet nichts), nur das wird hier klargestellt.
  function emailVerifyBannerHtml(c) {
    if (!c || c.emailVerified) return "";
    return `<div class="needs-action" id="verify-banner">
      <strong>Bitte bestätigen Sie Ihre E-Mail-Adresse.</strong> Wir haben einen Link an ${esc(c.email)} geschickt.

      Bestätigung vorbereitet und veröffentlicht.
      <div style="margin-top:8px"><button type="button" class="link" id="resend-verify">Bestätigungsmail erneut senden</button>
      <span id="resend-verify-status" aria-live="polite"></span></div>
    </div>`;
  }

  // Panel v6 Aufgabe 3: der Teil ab "Warten auf Ihre Freigabe" war urspruenglich Teil von
  // doneHtml() allein - jetzt geteilt zwischen doneHtml() (Erst-Setup-Abschluss, unveraendertes

  // dieselbe Logik (Freigaben/Vorschau/Jetzt-posten/Beitraege/Kalender/Konto) nutzen, ohne sie

    return `
      ${c.approvalMode ? `<h2>Warten auf Ihre Freigabe</h2>
      <p class="lede" id="dash-approvals-intro" style="font-size:16px;margin-bottom:16px"></p>
      <div id="dash-approvals"><p class="empty">Wird geladen …</p></div>` : ""}
      <h2>Die nächsten 7 Tage</h2>
      <p class="lede" style="font-size:16px;margin-bottom:16px">Schauen Sie sich vorbereitete Beiträge an, bevor sie automatisch veröffentlicht werden - Text bearbeiten, Bild-Farbe ändern oder überspringen.</p>
      <div class="actions"><button class="btn" data-go="preview">Vorschau ansehen</button></div>
      <h2>Jetzt posten</h2>
      <p class="lede" style="font-size:16px;margin-bottom:16px">Sie möchten sofort zu einem bestimmten Thema einen Beitrag? Wir übernehmen das beim nächsten Lauf.</p>
      ${postNowStatusHtml(c.lastPostRequest)}
      <div class="field">
        <label for="f-postNowTopic" class="vh">Thema (optional)</label>
        <input id="f-postNowTopic" type="text" placeholder="Worum soll es gehen? (optional)" maxlength="300" ${hasOpenPostRequest(c) ? "disabled" : ""}>
      </div>
      ${S.aiAvailable && !hasOpenPostRequest(c) ? `<p class="hint"><button type="button" class="link" id="suggest-topics">Ideen vorschlagen</button></p>
      <div id="topic-suggestions" class="chips" hidden></div>` : ""}
      <div class="actions">
        <button class="btn" id="post-now-btn" ${hasOpenPostRequest(c) ? "disabled" : ""}>Jetzt zu diesem Thema posten</button>
      </div>
      <h2>Letzte Beiträge</h2>
      <div id="dash-posts" class="post-grid"><p class="empty">Wird geladen …</p></div>
      <div class="actions"><button class="link" data-go="history">Alle Beiträge ansehen</button></div>
      <h2>Kalender</h2>
      <div id="dash-cal" class="cal"><p class="empty">Wird geladen …</p></div>
      <h2>Später wiederkommen</h2>
      <p style="color:var(--stone)">Auf diesem Gerät bleiben Sie angemeldet. Für andere Geräte erzeugen Sie einen persönlichen Link. Behandeln Sie ihn wie ein Passwort, ein neuer Link ersetzt den alten.</p>

  function doneHtml() {

    return `

  // Schritt-Kette als Startpunkt, entfernt aber nichts: "Stil bearbeiten"/"Kanäle verwalten"
  // bleiben ueber die Kacheln unten jederzeit erreichbar, der Rest (Freigaben/Vorschau/Jetzt
  // posten/Beitraege/Kalender/Konto) ist exakt dieselbe Logik wie zuvor auf der "Fertig"-Seite

  function dashboardTilesHtml() {
    const tiles = [
      { go: "preview", lbl: "Vorschau", sub: "Die nächsten 7 Tage" },
      { go: "history", lbl: "Verlauf", sub: "Veröffentlichte Beiträge" },
      { go: S.providers[0]?.id || "company", lbl: "Kanäle verwalten", sub: "Verbindungen prüfen" },
      { go: "company", lbl: "Stil bearbeiten", sub: "Angaben ändern" },

        <span class="dash-tile-sub">${esc(t.sub)}</span>
      </button>`).join("")}</div>`;
  }

  const CHANNEL_STATUS_LABEL = { ok: "Verbunden", "renew-soon": "Läuft bald ab", expired: "Abgelaufen" };
  function channelsSummaryHtml() {
    return `<div class="dash-channels">${S.providers.map((p) => {

      return `<button type="button" class="dash-channel-row" data-go="${p.id}">

  function calendarHtml(posts, frequency) {
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7; // Mo=0..So=6
    const postingDays = { taeglich: [0, 1, 2, 3, 4, 5, 6], werktags: [1, 2, 3, 4, 5], "3x-woche": [1, 3, 5] }[frequency] || [1, 2, 3, 4, 5];
    const postedDates = new Set(posts.map((p) => new Date(p.postedAt).toDateString()));
    const todayStr = now.toDateString();

    const cells = [];
    for (let i = 0; i < firstWeekday; i++) cells.push(`<div></div>`);
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(year, month, day);
      const isPast = d < new Date(year, month, now.getDate());
      const posted = postedDates.has(d.toDateString());
      const planned = !posted && !isPast && postingDays.includes(d.getDay());
      cells.push(`<div class="cal-day${d.toDateString() === todayStr ? " today" : ""}">${day}${posted ? '<span class="dot posted"></span>' : planned ? '<span class="dot planned"></span>' : ""}</div>`);
    }
    const monthLabel = now.toLocaleDateString("de-AT", { month: "long", year: "numeric", timeZone: "Europe/Vienna" });
    return `<p class="hint" style="margin-bottom:8px">${esc(monthLabel)}</p>
      <div class="cal-grid">
        ${["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map((d) => `<div class="hd">${d}</div>`).join("")}
        ${cells.join("")}
      </div>
      <div class="cal-legend"><span><i class="dot posted"></i>Veröffentlicht</span><span><i class="dot planned"></i>Geplant</span></div>`;
  }

    const overlay = $("#lightbox-overlay");
    const img = $("#lightbox-img");
    if (!overlay || !img) return;
    img.src = src;
    img.alt = alt || "";
    overlay.hidden = false;
  }
  function closeLightbox() {
    const overlay = $("#lightbox-overlay");
    if (overlay) overlay.hidden = true;
    const img = $("#lightbox-img");
    if (img) img.src = "";
  }

  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "company") return;
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    const edit = !!S.customer;
    if (!edit) body.consent = !!form.consent?.checked;
    // FormData omits unchecked boxes entirely (rather than sending false), so read these
    // directly off the elements instead of trusting fd.entries() for them.
    body.igFeedEnabled = !!form.igFeedEnabled?.checked;
    body.igStoryEnabled = !!form.igStoryEnabled?.checked;
    body.linkedinEnabled = !!form.linkedinEnabled?.checked;
    body.emojisEnabled = !!form.emojisEnabled?.checked;
    body.approvalMode = !!form.approvalMode?.checked;
    syncPillarsDraftFromDom();
    body.contentPillars = S.pillarsDraft.filter((p) => p.title.trim());
    const igDays = Array.from(form.querySelectorAll('[data-weekday-channel="instagram"] input:checked')).map((el) => Number(el.value));
    const liDays = Array.from(form.querySelectorAll('[data-weekday-channel="linkedin"] input:checked')).map((el) => Number(el.value));
    body.instagramWeekdays = igDays.join(",");
    body.linkedinWeekdays = liDays.join(",");
    body.activeWeekdays = body.instagramWeekdays;
    body.frequency = classifyFrequency(igDays.length ? igDays : [1, 2, 3, 4, 5]);

    form.querySelectorAll(".err").forEach((n) => n.remove());
    form.querySelectorAll("[aria-invalid]").forEach((n) => n.removeAttribute("aria-invalid"));

    const errors = {};
    if (!body.company?.trim()) errors.company = "Bitte geben Sie Ihren Firmennamen ein.";
    if (!body.contactName?.trim()) errors.contactName = "Bitte geben Sie Ihren Namen ein.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.email || "")) errors.email = "Bitte geben Sie eine gültige E-Mail-Adresse ein.";
    if (!edit && !body.consent) errors.consent = "Ohne Ihre Zustimmung können wir nicht für Sie posten.";
    if (Object.keys(errors).length) {
      // Required fields on page 1 are exempt from HTML5 validation while hidden behind page 2 -
      // jump back so the error is actually visible instead of failing silently.
      const part1Fields = ["company", "contactName", "email"];
      if (!edit && S.formPart !== 1 && Object.keys(errors).some((k) => part1Fields.includes(k))) {
        switchFormPart(1);
      }
      return showFieldErrors(form, errors);
    }

    const btn = form.querySelector("button[type=submit]");
    btn.classList.add("busy");
    try {
      applyState(await api(edit ? "PATCH" : "POST", edit ? "/api/me" : "/api/signup", body));
      S.step = edit ? landingStep() : S.providers[0]?.id || "done";
      S.banner = edit ? { kind: "ok", text: "Angaben gespeichert." } : null;
      render(true);
    } catch (err) {
      btn.classList.remove("busy");
      if (err.fields) return showFieldErrors(form, err.fields);
      S.banner = { kind: "bad", text: err.message };
      render(true);
    }
  });

  function showFieldErrors(form, errors) {
    let first;
    for (const [name, msg] of Object.entries(errors)) {
      const input = form.querySelector(`[name="${name}"]`);
      if (!input) continue;
      input.setAttribute("aria-invalid", "true");
      const p = document.createElement("p");
      p.className = "err"; p.id = `err-${name}`; p.textContent = msg;
      input.setAttribute("aria-describedby", p.id);
      (name === "consent" ? input.closest(".check") : input).insertAdjacentElement("afterend", p);
      first = first || input;
    }
    first?.focus();
  }

  async function init() {
    if (DEMO) $("#demo").hidden = false;
    try {
      const p = await api("GET", "/api/providers");
      S.providers = p.providers;
      S.aiAvailable = Boolean(p.aiAvailable);
      S.trialDays = Number(p.trialDays) || 7;
      S.turnstileSiteKey = p.turnstileSiteKey || null;
    } catch {
      $("#stage").innerHTML = `<div class="banner bad" role="alert">Das Panel ist gerade nicht erreichbar. Bitte laden Sie die Seite in ein paar Minuten neu.</div>`;
      return;
    }
    try { applyState(await api("GET", "/api/me")); } catch { /* noch nicht angemeldet */ }

    const q = new URLSearchParams(location.search);
    const pName = prov(q.get("provider"))?.name || "";
    if (q.get("connected") && prov(q.get("connected"))) {
      const id = q.get("connected");
      const list = steps();
      S.step = list[list.indexOf(id) + 1];
      S.banner = { kind: "ok", text: `${prov(id).name} ist verbunden.` };
    } else if (q.get("verified")) {
      S.banner = { kind: "ok", text: "E-Mail-Adresse bestätigt - danke! Beiträge werden ab jetzt vorbereitet." };
      S.step = landingStep();
    } else if (q.get("error")) {
      const fn = ERRORS[q.get("error")] || ERRORS.failed;
      S.banner = { kind: "bad", text: fn(pName) };
      S.step = S.customer && prov(q.get("provider")) ? q.get("provider") : firstOpenStep();
    } else {
      // Panel v6 Aufgabe 3: wiederkehrender Kunde (mind. 1 Kanal je verbunden) landet direkt auf
      // dem neuen Dashboard statt wieder bei "Unternehmen"/der Schritt-Kette.
      S.step = landingStep();
    }
    if (q.has("connected") || q.has("error") || q.has("verified")) history.replaceState(null, "", location.pathname);
    render(false);
  }

    await sleep(250);
    if (url === "/api/providers") return { providers: DEMO_PROVIDERS, aiAvailable: true, trialDays: 7 };
    if (url === "/api/improve-briefing") {
      const company = body?.company || "Ihr Unternehmen";
      const industry = body?.industry ? ` in der Branche ${body.industry}` : "";
      return {
        suggestion: `${company}${industry} richtet sich an lokale Kundinnen und Kunden, die auf der Suche nach einem verlässlichen Ansprechpartner sind. Im Mittelpunkt der Beiträge stehen konkrete Tipps aus dem Alltag, Einblicke hinter die Kulissen und die Themen, die die Zielgruppe wirklich bewegen. Ziel ist es, Vertrauen aufzubauen und neue Anfragen zu gewinnen. (Vorschau-Beispiel)`,
      };
    }
    if (url === "/api/suggest-topics") {
      return { topics: ["Ein Kundenerfolg aus der letzten Woche", "Ein häufiges Missverständnis in Ihrer Branche aufklären", "Ein kurzer Tipp, den Sie sonst nur persönlich weitergeben"] };
    }
    if (url === "/api/suggest-pillars") {
      return {
        pillars: [
          { title: "Tipps & Tricks", description: "Kurze, direkt umsetzbare Ratschläge rund um Ihr Angebot. (Vorschau-Beispiel)" },
          { title: "Hinter den Kulissen", description: "Einblicke in Ihren Arbeitsalltag, die Vertrauen schaffen. (Vorschau-Beispiel)" },
          { title: "Kundenstimmen", description: "Erfahrungen und Erfolge Ihrer Kundinnen und Kunden. (Vorschau-Beispiel)" },
        ],
      };
    }
    if (url === "/api/planned-posts" && method === "GET") {
      if (!MOCK.plannedPosts) {
        const today = localDateStr(new Date());
        const tomorrow = localDateStr(new Date(Date.now() + 86400000));
        MOCK.plannedPosts = [
          { id: "plan1", channel: "ig_feed", scheduledFor: today, status: "planned", headline: "Mobilität neu entdecken", caption: "Ein Beispieltext für die Vorschau. (Vorschau-Beispiel)", imageUrl: "", pillarTitle: null, accentColorUsed: null, regenerateCount: 0 },
          { id: "plan2", channel: "ig_story", scheduledFor: today, status: "planned", headline: "Tipp des Tages", caption: "", imageUrl: "", pillarTitle: null, accentColorUsed: null, regenerateCount: 0 },
          { id: "plan3", channel: "linkedin", scheduledFor: tomorrow, status: "planned", headline: "Ein Blick hinter die Kulissen", caption: "Ein Beispieltext für die Vorschau. (Vorschau-Beispiel)", imageUrl: "", pillarTitle: null, accentColorUsed: null, regenerateCount: 1 },
        ];
      }
      return { posts: MOCK.plannedPosts, maxRegenerate: 3 };
    }
    if (/^\/api\/planned-posts\/[^/]+$/.test(url) && method === "PATCH") {
      const id = url.split("/").pop();
      const p = (MOCK.plannedPosts || []).find((x) => x.id === id);
      if (!p) throw Object.assign(new Error("Beitrag nicht gefunden."), { status: 404 });
      if (body.headline !== undefined) p.headline = body.headline;
      if (body.caption !== undefined) p.caption = body.caption;
      if (p.status === "planned") p.status = "edited";
      return { post: p };
    }
    if (/^\/api\/planned-posts\/[^/]+\/regenerate-image$/.test(url) && method === "POST") {
      const id = url.split("/")[3];
      const p = (MOCK.plannedPosts || []).find((x) => x.id === id);
      if (!p) throw Object.assign(new Error("Beitrag nicht gefunden."), { status: 404 });
      if (p.regenerateCount >= 3) throw Object.assign(new Error("Maximale Anzahl an Neuerstellungen erreicht."), { status: 429 });
      p.regenerateCount++;
      p.accentColorUsed = body?.accentColor || p.accentColorUsed;
      return { post: p, maxRegenerate: 3 };
    }
    if (/^\/api\/planned-posts\/[^/]+\/skip$/.test(url) && method === "POST") {
      const id = url.split("/")[3];
      const p = (MOCK.plannedPosts || []).find((x) => x.id === id);
      if (!p) throw Object.assign(new Error("Beitrag nicht gefunden."), { status: 404 });
      p.status = "rejected";
      return { post: p };
    }
    if (/^\/api\/planned-posts\/[^/]+\/approve$/.test(url) && method === "POST") {
      const id = url.split("/")[3];
      const p = (MOCK.plannedPosts || []).find((x) => x.id === id);
      if (!p) throw Object.assign(new Error("Beitrag nicht gefunden."), { status: 404 });
      p.status = "approved";
      return { post: p };
    }
    if (url === "/api/analyze-website") {
      return {
        suggestion: {
          industry: "Dienstleistung",
          about: "Ein lokales Unternehmen, das auf persönlichen Service und Qualität setzt. Die Zielgruppe sind Menschen in der Region, die einen verlässlichen Ansprechpartner suchen. (Vorschau-Beispiel, aus der Website-Adresse geraten)",
          tone: "sachlich",
          hashtags: ["lokal", "qualitaet", "service"],
        },
      };
    }
    if (url === "/api/me" && method === "GET") {
      if (!MOCK.customer) throw Object.assign(new Error("Nicht angemeldet"), { status: 401 });
      return mockState();
    }
    if (url === "/api/signup" || (url === "/api/me" && method === "PATCH")) {
      const { consent, ...data } = body;
      const isSignup = url === "/api/signup";
      const demoNextPost = new Date(Date.now() + 2 * 86400000).toISOString();
      MOCK.customer = {
        trialDaysLeft: 7, trialExpired: false, nextPostAt: demoNextPost, dueNow: false, customerPaused: false, emailVerified: true,
        ...MOCK.customer,
        ...data,
        ...(isSignup ? { trialDaysLeft: 7, trialExpired: false, nextPostAt: demoNextPost, dueNow: false, customerPaused: false, emailVerified: true } : {}),
      };
      return mockState();
    }
    if (url.startsWith("/api/disconnect/")) {
      MOCK.connections = MOCK.connections.filter((c) => c.provider !== url.split("/").pop());
      return mockState();
    }
    if (url === "/api/pause") {
      MOCK.customer = { ...MOCK.customer, customerPaused: body.paused === true, dueNow: body.paused === true ? false : MOCK.customer.dueNow };
      return mockState();
    }
    if (url === "/api/approvals") return { approvals: [] };
    if (url === "/api/logo" && method === "POST") {
      MOCK.logoDataUrl = body.imageBase64;
      MOCK.customer = { ...MOCK.customer, hasLogo: true };
      return mockState();
    }
    if (url === "/api/logo" && method === "DELETE") {
      MOCK.logoDataUrl = null;
      MOCK.customer = { ...MOCK.customer, hasLogo: false };
      return mockState();
    }
    if (url === "/api/themes") {
      const theme = { id: `theme_${Date.now()}`, name: body.name, accentColor: body.accentColor || null, watermarkText: body.watermarkText || null, createdAt: new Date().toISOString() };
      MOCK.customer.savedThemes = [...(MOCK.customer.savedThemes || []), theme];
      return { ok: true, theme, savedThemes: MOCK.customer.savedThemes };
    }
    if (/^\/api\/themes\/.+\/activate$/.test(url)) {
      const id = url.split("/")[3];
      MOCK.customer = { ...MOCK.customer, activeThemeId: id };
      return mockState();
    }
    if (url === "/api/themes/deactivate") {
      MOCK.customer = { ...MOCK.customer, activeThemeId: null };
      return mockState();
    }
    if (/^\/api\/approvals\/.+\/(approve|reject)$/.test(url)) return { ok: true };
    if (url === "/api/post-now") {
      const request = { id: "preq_demo", topic: body.topic || "", status: "pending", createdAt: new Date().toISOString() };
      MOCK.customer = { ...MOCK.customer, lastPostRequest: request };
      return { ok: true, request };
    }
    if (url === "/api/me" && method === "DELETE") {
      MOCK.customer = null; MOCK.connections = [];
      return { ok: true };
    }
    if (url === "/api/access-link") return { link: "https://mcp.pipebot.at/panel/login?key=vorschau-beispiel" };
    if (url === "/api/posts") return { posts: MOCK.posts };
    if (url === "/api/logout") { MOCK.customer = null; MOCK.connections = []; return { ok: true }; }
    throw new Error("Unbekannt");
  }

  async function demoConnect(id) {
    const p = prov(id);
    const ov = document.createElement("div");
    ov.className = "overlay"; ov.setAttribute("role", "status");
    ov.textContent = `Weiterleitung zu ${p.name} …`;
    document.body.append(ov);
    await sleep(1100);
    ov.remove();
    const now = new Date();
    MOCK.connections = MOCK.connections.filter((c) => c.provider !== id).concat({
      provider: id,
      accountName: id === "instagram" ? "@" + (MOCK.customer.company || "ihrfirma").toLowerCase().replace(/[^a-z0-9]/g, "") : MOCK.customer.contactName,
      connectedAt: now.toISOString(),
      expiresAt: new Date(now.getTime() + 60 * 86400000).toISOString(),
      status: "ok",
    });
    S.connections = MOCK.connections;
    const list = steps();
    S.step = list[list.indexOf(id) + 1];
    S.banner = { kind: "ok", text: `${p.name} ist verbunden.` };
    render(true);
  }

  init();
})();
</script>
</body>
</html>
