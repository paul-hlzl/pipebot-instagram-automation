<!--
  Mount-agnostisch: das Panel laeuft unter /panel, /panel/sandbox und spaeter unter einer eigenen
  Domain. Die SPA wird immer NUR am Mount-Wurzelpfad ausgeliefert - der Pfad ohne abschliessenden
  Slash ist also exakt der Mount. Das <base>-Tag muss vor dem Stylesheet stehen, sonst wuerde
  "panel.css" bei einem Aufruf ohne Slash (https://host/panel) faelschlicherweise zu /panel.css
  aufgeloest (Produktion antwortet dort mit 200, ohne Redirect - genau der Fallstrick).
-->
<script>
  (function () {
    var path = location.pathname.replace(/\/+$/, "");
    var filePreview = location.protocol === "file:" || /\.html?$/i.test(path);
    var base = document.createElement("base");
    base.href = filePreview ? "./" : path + "/";
    document.head.appendChild(base);
  })();
</script>

     Aenderung konnte bis zu 5 Minuten alt beim Kunden ankommen. ?v=... erzwingt eine neue

     panel-theme.css inhaltlich aendert, muss dieser Wert hier UND unten beim <script> UND in
     admin.html von Hand hochgezaehlt werden - es gibt keinen Build-Schritt, der das automatisch

<div id="splash" aria-hidden="true">
  <div class="splash-panel splash-left"></div>
  <div class="splash-panel splash-right"></div>
  <div class="splash-content">
    <div class="splash-word">Pipeflow</div>
    <div class="splash-sub">Powered by Pipeline AI Solutions</div>
  </div>
</div>
<script>
  (function () {
    // Redesign: der volle Auftritt laeuft nur EINMAL pro Browser-Sitzung (vorher bei jedem
    // Reload 1,5s - beim zehnten Oeffnen am Tag ist das kein Markenmoment mehr, sondern eine
    // Wartezeit). Zurueckdrehbar: SPLASH_EVERY_LOAD auf true setzen.
    var SPLASH_EVERY_LOAD = false;
    var splash = document.getElementById("splash");
    if (!splash) return;
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var seen = false;
    try { seen = sessionStorage.getItem("pf-splash") === "1"; } catch (e) { /* Privatmodus: dann eben jedes Mal */ }
    if (seen && !SPLASH_EVERY_LOAD) { splash.remove(); return; }
    try { sessionStorage.setItem("pf-splash", "1"); } catch (e) { /* egal */ }
    var holdMs = reduced ? 200 : 1100;
    setTimeout(function () {
      splash.classList.add("splash-done");
      setTimeout(function () { splash.remove(); }, 320);
    }, holdMs);
  })();
</script>
