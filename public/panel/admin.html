<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Pipeflow – Admin</title>

<!--
  Redesign "Flow", Phase 6. Mount-agnostisch wie index.html: die Seite laeuft unter
  /panel/admin und /panel/sandbox/admin. Der Aufruf OHNE abschliessenden Slash antwortet mit
  200 (kein Redirect) - ohne <base> wuerde "../fonts/..." dort eine Ebene zu hoch zeigen.
  Das Tag muss vor dem Preload und dem <style> stehen.
-->
<script>
  (function () {
    var path = location.pathname.replace(/\/+$/, "");
    var filePreview = location.protocol === "file:" || /\.html?$/i.test(path);
    var base = document.createElement("base");
    base.href = filePreview ? "./" : path + "/";
    document.head.appendChild(base);
  })();
</script>

<!-- Schrift selbst gehostet (DSGVO): dieselbe Datei wie im Kunden-Panel, serviert unter
     ${panelMount}/fonts - vom Admin-Mount aus also eine Ebene hoeher. Google Fonts entfaellt. -->
<link rel="preload" href="../fonts/SchibstedGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Schibsted Grotesk";
  font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("../fonts/SchibstedGrotesk-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
    U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Schibsted Grotesk";
  font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("../fonts/SchibstedGrotesk-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
    U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
    U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* --- Tokens: identisch zu panel.css, keine eigenen Werte --- */
:root {
  --paper: #FFFFFF; --ink: #000000; --stone: #666666; --rule: #E3E3E3; --wash: #F5F5F5;
  --go: #137A3F; --stop: #B42318;
  --line-strong: #C9C9C9; --warn-bg: #FDF2E0; --warn-line: #E8C468; --warn-ink: #7A5600;
  --shadow-menu: 0 4px 16px rgb(0 0 0 / .10);
  --t-display: clamp(28px, 6.5vw, 44px);
  --t-h1: clamp(23px, 4.5vw, 32px);
  --t-h2: 19px; --t-body: 16px; --t-small: 14px; --t-micro: 12px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r1: 8px; --r2: 12px; --r3: 18px;
  --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
  --ease: cubic-bezier(.2,.8,.2,1);
  --node-s: 10px;
  --page: 1320px;   /* Datentabelle, kein Lesetext - darf breiter sein als das Kunden-Panel */
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur-1: 1ms; --dur-2: 1ms; --dur-3: 1ms; }
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

* { box-sizing: border-box; }
img, svg { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--t-body); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2 { margin: 0; text-wrap: balance; letter-spacing: -.02em; line-height: 1.18; }
h1 { font-size: var(--t-h1); font-weight: 700; }
h2 { font-size: var(--t-h2); font-weight: 700; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--stone); }
.small { font-size: var(--t-small); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

.skip-link {
  position: fixed; top: var(--s2); left: var(--s2); z-index: 200;
  background: var(--ink); color: var(--paper); padding: var(--s2) var(--s3);
  border-radius: var(--r1); transform: translateY(-200%); transition: transform var(--dur-2) var(--ease);
}
.skip-link:focus { transform: none; }

/* --- Kopf --- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  min-height: 60px; padding: var(--s2) var(--s4);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: var(--s2); font-weight: 700; letter-spacing: -.02em; }
.brand span { color: var(--stone); font-weight: 400; }
main { max-width: var(--page); margin: 0 auto; padding: var(--s6) var(--s4) var(--s8); }
@media (min-width: 768px) {
  .top { padding: var(--s2) var(--s6); }
  main { padding: var(--s7) var(--s6) var(--s8); }
}

.section + .section { margin-top: var(--s7); padding-top: var(--s7); border-top: 1px solid var(--rule); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4); }

/* --- Buttons und Felder: gleiche Komponenten wie im Kunden-Panel --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 44px; padding: var(--s3) var(--s5);
  border: 1px solid var(--ink); border-radius: var(--r3);
  background: var(--paper); color: var(--ink); font: inherit; font-weight: 500;
  cursor: pointer; text-decoration: none; text-align: center;
  transition: transform var(--dur-1) var(--ease), background var(--dur-1) var(--ease), opacity var(--dur-1) var(--ease);
}
.btn:active { transform: scale(.98); }
.btn:hover { background: var(--wash); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: #1a1a1a; }
.btn-quiet { border-color: var(--line-strong); }
.btn-small { min-height: 38px; padding: var(--s2) var(--s3); font-size: var(--t-small); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-block { width: 100%; }
.btn.busy { position: relative; color: transparent; pointer-events: none; }
.btn.busy::after {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent; color: var(--paper);
  animation: spin 700ms linear infinite;
}
.btn:not(.btn-primary).busy::after { color: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }
/* Am Handy ist jede Zeilenaktion ein eigener Treffer - volle Breite statt vier 38px-Knoepfe. */
@media (max-width: 767px) { .row-actions .btn-small { flex: 1 1 140px; min-height: 44px; } }

.field { margin-bottom: var(--s5); }
.field > label { display: block; font-size: var(--t-small); font-weight: 500; margin-bottom: var(--s2); }
input[type=text], input[type=email], input[type=password], input[type=number], select {
  width: 100%; font: inherit; font-size: var(--t-body); /* nie <16px: sonst zoomt iOS */
  color: var(--ink); background: var(--paper);
  border: 1px solid var(--line-strong); border-radius: var(--r1);
  padding: var(--s3); min-height: 44px;
  transition: border-color var(--dur-1) var(--ease);
}
input:hover, select:hover { border-color: var(--stone); }
input:focus, select:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
.hint { color: var(--stone); font-size: var(--t-small); margin-top: var(--s2); }

/* --- Anmeldung --- */
.loginwrap { max-width: 380px; margin: 12vh auto 0; }
.loginwrap h1 { margin-bottom: var(--s2); }
.loginwrap > p { color: var(--stone); font-size: var(--t-small); margin-bottom: var(--s5); }
.notice {
  border: 1px solid var(--rule); border-left: 3px solid var(--ink);
  border-radius: var(--r1); padding: var(--s3) var(--s4); font-size: var(--t-small);
  margin-bottom: var(--s4);
}
.notice.bad { border-left-color: var(--stop); color: var(--stop); }

/* --- Statussatz: eine Aussage, wie auf der Kunden-Übersicht --- */
.status-line { font-size: var(--t-display); font-weight: 700; letter-spacing: -.02em; line-height: 1.12; max-width: 20ch; }
.status-line.problem { color: var(--stop); }
.status-sub { color: var(--stone); font-size: var(--t-small); margin-top: var(--s3); }

/* --- Zahlen: Schrift und Weißraum statt Kachelwand --- */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s5) var(--s4); }
@media (min-width: 640px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .metrics { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.metric .n { font-size: var(--t-h1); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric .l { font-size: var(--t-small); color: var(--stone); margin-top: var(--s1); }
.metric.warn .n { color: var(--stop); }

/* --- Tabelle: Desktop Tabelle, Handy Karten --- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
th, td { text-align: left; padding: var(--s3); border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: var(--t-small); color: var(--stone); font-weight: 500; white-space: nowrap; }
tbody tr:hover td { background: var(--wash); }
.company-cell strong { display: block; font-size: var(--t-body); letter-spacing: -.01em; }
.company-cell .meta { color: var(--stone); font-size: var(--t-micro); display: block; margin-top: 2px; }

/* --- Zustands-Chips: Umriss wie die Pipe, Farbe nur für Bedeutung --- */
.chip {
  display: inline-flex; align-items: center; gap: var(--s2);
  padding: 2px var(--s2); margin: 0 var(--s1) var(--s1) 0;
  border: 1px solid var(--line-strong); border-radius: var(--r3);
  font-size: var(--t-micro); font-weight: 500; white-space: nowrap;
}
.chip .dot { width: var(--node-s); height: var(--node-s); border: 1px solid currentColor; }
.chip.ok { border-color: var(--go); color: var(--go); }
.chip.ok .dot { background: currentColor; }
.chip.warn { border-color: var(--warn-line); color: var(--warn-ink); }
.chip.bad { border-color: var(--stop); color: var(--stop); }
.chip.bad .dot { background: currentColor; }

/* --- Dialoge: einzige Ebene mit Schatten --- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: rgb(0 0 0 / .45);
  display: grid; place-items: center; padding: var(--s4);
  animation: fade var(--dur-2) var(--ease) both;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--paper); border-radius: var(--r2); box-shadow: var(--shadow-menu);
  width: 100%; max-width: 640px; max-height: 88dvh; overflow: auto;
  padding: var(--s5); animation: pop var(--dur-2) var(--ease) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
.icon-btn {
  flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid var(--line-strong); border-radius: 50%; background: var(--paper);
  color: var(--ink); cursor: pointer;
}
.icon-btn:hover { background: var(--wash); }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: var(--s2) var(--s4); font-size: var(--t-small); margin: 0 0 var(--s5); }
.kv dt { color: var(--stone); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.posts-list { list-style: none; margin: 0; padding: 0; }
.posts-list li { padding: var(--s3) 0; border-bottom: 1px solid var(--rule); font-size: var(--t-small); }
.posts-list time { color: var(--stone); font-size: var(--t-micro); display: block; }

.confirm-dialog { max-width: 420px; }
.confirm-dialog h2 { margin-bottom: var(--s2); }
.confirm-dialog p { color: var(--stone); font-size: var(--t-small); }
.confirm-dialog .field { margin: var(--s4) 0 0; }
.confirm-actions { display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s5); }
.confirm-actions button {
  min-height: 44px; padding: var(--s3) var(--s5); border-radius: var(--r3);
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  font: inherit; font-weight: 500; cursor: pointer;
}
.confirm-ok { background: var(--ink); color: var(--paper); }
.confirm-ok.danger { background: var(--stop); border-color: var(--stop); }
.confirm-cancel { border-color: var(--line-strong); }
@media (max-width: 480px) {
  .confirm-actions { flex-direction: column-reverse; }
  .confirm-actions button { width: 100%; }
}

.row-actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
/* Am Desktop bleiben die Aktionen in EINER Zeile - sonst umbricht jede Kundenzeile ein zweites Mal
   und die Liste wirkt doppelt so unruhig, wie sie ist. Die Tabelle scrollt notfalls seitlich. */
@media (min-width: 768px) { .row-actions { flex-wrap: nowrap; } .row-actions .btn-small { white-space: nowrap; } }
.tool { border: 1px solid var(--rule); border-radius: var(--r2); padding: var(--s4); }
.tool + .tool { margin-top: var(--s4); }
.tool h2 { margin-bottom: var(--s2); }
.tool-form { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: flex-end; margin-top: var(--s4); }
.tool-form .field { margin: 0; }
.loading { color: var(--stone); padding: var(--s8) 0; text-align: center; }

@media (max-width: 767px) {
  table, thead, tbody, tr, th, td { display: block; }
  thead { display: none; }
  tbody tr { border: 1px solid var(--rule); border-radius: var(--r2); padding: var(--s3); margin-bottom: var(--s3); }
  tbody tr:hover td { background: transparent; }
  /* Label links, Wert rechts in EINER Zeile: sonst ist jede Kundenkarte am Handy 12 Zeilen hoch. */
  td { border: 0; padding: var(--s2) 0; display: flex; gap: var(--s3); align-items: baseline; justify-content: space-between; }
  td::before { content: attr(data-label); flex: 0 0 auto; font-size: var(--t-micro); font-weight: 500; color: var(--stone); }
  td[data-label="Firma"], td[data-label="Aktionen"] { display: block; }
  td[data-label="Firma"]::before, td[data-label="Aktionen"]::before { display: none; }
  td[data-label="Kanäle"] { flex-wrap: wrap; justify-content: flex-start; }
  .kv { grid-template-columns: 1fr; gap: 0 0; }
  .kv dt { margin-top: var(--s3); }
  .modal { padding: var(--s4); }
}
</style>
</head>
<body>

<a class="skip-link" href="#app">Zum Inhalt springen</a>

<header class="top">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="3" height="3"/><rect x="3" y="1" width="5" height="1"/><rect x="8" y="0" width="3" height="3"/>
      <rect x="9" y="3" width="1" height="5"/><rect x="8" y="8" width="3" height="3"/><rect x="3" y="9" width="5" height="1"/><rect x="0" y="8" width="3" height="3"/>
    </svg>
    Pipeflow <span>Admin</span>
  </div>
  <button class="btn btn-quiet btn-small" id="logout" hidden>Abmelden</button>
</header>

<main id="app" tabindex="-1"><p class="loading">Wird geladen …</p></main>

<div id="confirm-overlay" class="overlay" hidden>
  <div class="modal confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <div class="field" id="confirm-inputwrap" hidden>
      <label for="confirm-input" id="confirm-input-label"></label>
      <input id="confirm-input" type="text" autocomplete="off">
    </div>
    <div class="confirm-actions">
      <button type="button" class="confirm-cancel" id="confirm-cancel">Abbrechen</button>
      <button type="button" class="confirm-ok" id="confirm-ok">Bestätigen</button>
    </div>
  </div>
</div>

<script>
(() => {
  // War hier fix auf "/panel/admin" gesetzt - dadurch sprachen ALLE Aufrufe dieser Seite (inkl.
  // Login) IMMER die Produktions-Admin-API an, auch wenn die Seite selbst unter
  // /panel/sandbox/admin/ aufgerufen wurde (gefunden beim Testen von Panel v9 Aufgabe 6, siehe
  // Session-Bericht - Sicherheitsrelevant: ein Sandbox-Test haette unbemerkt echte Produktions-
  // Kundendaten veraendern koennen). Gleiches Muster wie CONFIG.mount im Kunden-Panel.
  const MOUNT = location.pathname.startsWith("/panel/sandbox") ? "/panel/sandbox/admin" : "/panel/admin";
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("de-AT", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–";
  const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("de-AT", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";

  /* Pixel-Icons wie im Kunden-Panel: 11x11, crispEdges, currentColor - keine Emojis. */
  const ICON = {
    close: '<rect x="0" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="4" y="4" width="3" height="3"/><rect x="7" y="7" width="2" height="2"/><rect x="9" y="9" width="2" height="2"/><rect x="9" y="0" width="2" height="2"/><rect x="7" y="2" width="2" height="2"/><rect x="2" y="7" width="2" height="2"/><rect x="0" y="9" width="2" height="2"/>',
  };
  const icon = (name, size) => `<svg width="${size || 11}" height="${size || 11}" viewBox="0 0 11 11" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${ICON[name]}</svg>`;

  let banner = null;

  async function api(method, url, body) {
    const res = await fetch(MOUNT + url, {
      method, credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "Unbekannter Fehler"), { status: res.status });
    return data;
  }

  /* ---------------- Eigener Bestaetigungs-/Eingabe-Dialog (ersetzt confirm/alert/prompt) ---------------- */
  const confirmOverlay = $("#confirm-overlay");
  const confirmDialog = confirmOverlay.querySelector(".confirm-dialog");
  const confirmTitleEl = $("#confirm-title");
  const confirmMessageEl = $("#confirm-message");
  const confirmCancelBtn = $("#confirm-cancel");
  const confirmOkBtn = $("#confirm-ok");
  const confirmInputWrap = $("#confirm-inputwrap");
  const confirmInputLabel = $("#confirm-input-label");
  const confirmInput = $("#confirm-input");
  let confirmResolve = null;
  let confirmLastFocused = null;

  function confirmFocusables() {
    return Array.from(confirmDialog.querySelectorAll("button, input, [href], [tabindex]"))
      .filter((el) => !el.disabled && el.offsetParent !== null);
  }

  function closeConfirm(result) {
    confirmOverlay.hidden = true;
    document.removeEventListener("keydown", onConfirmKeydown, true);
    const resolve = confirmResolve;
    confirmResolve = null;
    if (confirmLastFocused && confirmLastFocused.focus) confirmLastFocused.focus();
    if (resolve) resolve(result);
  }

  function onConfirmKeydown(e) {
    if (e.key === "Escape") { e.preventDefault(); closeConfirm(false); return; }
    // Eingabefeld: Enter bestaetigt, sonst wuerde die Taste im Dialog ins Leere laufen.
    if (e.key === "Enter" && !confirmInputWrap.hidden && document.activeElement === confirmInput) {
      e.preventDefault(); confirmOkBtn.click(); return;
    }
    if (e.key !== "Tab") return;
    const els = confirmFocusables();
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  confirmOverlay.addEventListener("mousedown", (e) => { if (e.target === confirmOverlay) closeConfirm(false); });
  confirmCancelBtn.addEventListener("click", () => closeConfirm(false));
  confirmOkBtn.addEventListener("click", () => closeConfirm(confirmInputWrap.hidden ? true : confirmInput.value));

  function showConfirm({ title, message, confirmLabel = "Bestätigen", cancelLabel = "Abbrechen", danger = false, input = null } = {}) {
    return new Promise((resolve) => {
      if (confirmResolve) closeConfirm(false);
      confirmLastFocused = document.activeElement;
      confirmResolve = resolve;
      confirmTitleEl.textContent = title || "";
      confirmMessageEl.textContent = message || "";
      confirmMessageEl.hidden = !message;
      confirmOkBtn.textContent = confirmLabel;
      confirmOkBtn.className = "confirm-ok" + (danger ? " danger" : "");
      confirmCancelBtn.hidden = cancelLabel === null;
      if (cancelLabel !== null) confirmCancelBtn.textContent = cancelLabel;
      confirmInputWrap.hidden = !input;
      if (input) {
        confirmInputLabel.textContent = input.label || "";
        confirmInput.type = input.type || "text";
        confirmInput.value = input.value ?? "";
        if (input.min != null) confirmInput.min = input.min; else confirmInput.removeAttribute("min");
        if (input.inputmode) confirmInput.inputMode = input.inputmode; else confirmInput.removeAttribute("inputmode");
      }
      confirmOverlay.hidden = false;
      document.addEventListener("keydown", onConfirmKeydown, true);
      requestAnimationFrame(() => {
        if (input) { confirmInput.focus(); confirmInput.select(); }
        else (danger && !confirmCancelBtn.hidden ? confirmCancelBtn : confirmOkBtn).focus();
      });
    });
  }

  const showAlert = ({ title, message, okLabel = "OK" } = {}) =>
    showConfirm({ title, message, confirmLabel: okLabel, cancelLabel: null });
  const showError = (message) => showAlert({ title: "Fehler", message: message || "Etwas ist schiefgelaufen." });
  const showPrompt = ({ title, message, label, value, confirmLabel = "Übernehmen", type = "text", inputmode, min }) =>
    showConfirm({ title, message, confirmLabel, input: { label, value, type, inputmode, min } });

  /* ---------------- Login ---------------- */
  function renderLogin() {
    $("#logout").hidden = true;
    $("#app").innerHTML = `
      <div class="loginwrap">
        <h1>Admin-Anmeldung</h1>
        <p>Nur für Paul. Zugang über das Admin-Passwort aus der .env.</p>
        ${banner ? `<div class="notice ${banner.kind}" role="alert">${esc(banner.text)}</div>` : ""}
        <form id="loginform">
          <div class="field">
            <label for="pw">Passwort</label>
            <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
        </form>
      </div>`;
    $("#loginform").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.classList.add("busy");
      try {
        await api("POST", "/api/login", { password: $("#pw").value });
        banner = null;
        boot();
      } catch (err) {
        banner = { kind: "bad", text: err.status === 429 ? err.message : "Falsches Passwort." };
        renderLogin();
      }
    });
  }

  /* ---------------- Dashboard ---------------- */
  let DATA = null;

  /* Ein Satz statt vier Kennzahlen - dieselbe Priorisierung wie auf der Kunden-Übersicht:
     Problem zuerst, dann Hinweis, sonst Ruhe. */
  function statusHtml(m) {
    let text, sub, problem = false;
    if (m.connectionsNeedingAction > 0) {
      problem = true;
      text = `${m.connectionsNeedingAction} ${m.connectionsNeedingAction === 1 ? "Verbindung braucht" : "Verbindungen brauchen"} Handlung.`;
      sub = "Abgelaufene oder bald ablaufende Kanäle stehen unten in der Kundenliste.";
    } else if (m.trialExpired > 0) {
      text = `${m.trialExpired} ${m.trialExpired === 1 ? "Testphase ist" : "Testphasen sind"} abgelaufen.`;
      sub = "Verlängern oder unbefristet freischalten – beides direkt in der Zeile.";
    } else {
      text = "Alles läuft.";
      sub = `${m.active} von ${m.totalCustomers} ${m.totalCustomers === 1 ? "Kunde" : "Kunden"} aktiv · ${m.postsLast7Days} Beiträge in den letzten 7 Tagen.`;
    }
    return `<p class="status-line${problem ? " problem" : ""}">${esc(text)}</p>
      <p class="status-sub">${esc(sub)}</p>`;
  }

  function trialChip(c) {
    if (c.trial.unlimited) return `<span class="chip">unbefristet</span>`;
    if (c.trial.expired) return `<span class="chip bad"><i class="dot"></i>abgelaufen</span>`;
    return `<span class="chip">${c.trial.daysLeft} ${c.trial.daysLeft === 1 ? "Tag" : "Tage"}</span>`;
  }

  function channelChips(c) {
    if (!c.channels.length) return `<span class="muted small">keine</span>`;
    const label = { ok: "ok", "renew-soon": "läuft bald ab", expired: "abgelaufen" };
    const cls = { ok: "ok", "renew-soon": "warn", expired: "bad" };
    return c.channels.map((ch) =>
      `<span class="chip ${cls[ch.status] || ""}"><i class="dot"></i>${esc(ch.provider)}: ${esc(label[ch.status] || ch.status)}</span>`
    ).join("");
  }

  function metricsHtml(m) {
    const items = [
      ["Kunden gesamt", m.totalCustomers],
      ["Aktiv", m.active],
      ["In Testphase", m.inTrial],
      ["Testphase abgelaufen", m.trialExpired, m.trialExpired > 0],
      ["Beiträge (7 Tage)", m.postsLast7Days],
      ["Handlungsbedarf", m.connectionsNeedingAction, m.connectionsNeedingAction > 0],
    ];
    return items.map(([l, n, warn]) =>
      `<div class="metric${warn ? " warn" : ""}"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`
    ).join("");
  }

  // Panel v9 Aufgabe 6 (niedrige Prioritaet): grobe Kostenschaetzung der neuen KI-Aufrufe, nicht
  // exakte Abrechnung - kein eigenes grosses Feature, nur eine kurze Tabelle.
  const FEATURE_LABEL = {
    "analytics-summary": "Analytics-Zusammenfassung",
    "carousel-post": "Karussell-Beitrag",
    "comment-reply": "Kommentar-Antwort",
    "planned-post-branding-regen": "Branding-Neugenerierung",
    "stale-content-guard-regen": "Neugenerierung (veralteter Inhalt)",
    "voice-dictation": "Diktat-Transkription",
  };
  function usageCostsHtml(rows) {
    if (!rows || !rows.length) return "";
    const total = rows.reduce((sum, r) => sum + r.totalUsd, 0);
    return `<div class="tool">
      <h2>KI-Kosten (letzte 30 Tage, geschätzt)</h2>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Funktion</th><th>Aufrufe</th><th>Geschätzte Kosten</th></tr></thead>
        <tbody>${rows.map((r) => `<tr>
          <td data-label="Funktion">${esc(FEATURE_LABEL[r.feature] ?? r.feature)}</td>
          <td data-label="Aufrufe" class="num">${r.count}</td>
          <td data-label="Geschätzte Kosten" class="num">$${r.totalUsd.toFixed(4)}</td>
        </tr>`).join("")}</tbody>
      </table>
      </div>
      <p class="hint">Gesamt: $${total.toFixed(4)} · grobe Schätzung anhand der Anthropic-Tarife, keine exakte Abrechnung.</p>
    </div>`;
  }

  function rowHtml(c) {
    const extras = [
      c.notifyOnPublish ? "Mail bei Veröffentlichung: an" : "",
      c.analyticsFollowers != null ? `Analytics: ${c.analyticsFollowers} Follower` : "",
      c.commentAutomationEnabled ? `Kommentare (30 T): ${c.commentStats30d.answered} beantwortet, ${c.commentStats30d.skipped} übersprungen, ${c.commentStats30d.pendingApproval} wartend` : "",
    ].filter(Boolean);
    return `<tr data-id="${esc(c.customerId)}">
      <td data-label="Firma"><div class="company-cell">
        <strong>${esc(c.company)}</strong>
        <span class="meta">${esc(c.contactName)} · ${esc(c.email)}</span>
        ${extras.map((t) => `<span class="meta">${esc(t)}</span>`).join("")}
      </div></td>
      <td data-label="Erstellt" class="num">${fmtDate(c.createdAt)}</td>
      <td data-label="Status">${c.status === "active"
        ? `<span class="chip ok"><i class="dot"></i>aktiv</span>`
        : `<span class="chip warn">pausiert</span>`}</td>
      <td data-label="Testphase">${trialChip(c)}</td>
      <td data-label="Kanäle">${channelChips(c)}</td>
      <td data-label="Beiträge"><span class="num">${c.postCount}</span>${c.lastPostAt ? `<span class="meta muted small"> · zuletzt ${fmtDate(c.lastPostAt)}</span>` : ""}</td>
      <td data-label="Aktionen"><div class="row-actions">
        <button class="btn btn-quiet btn-small" data-action="details" data-id="${esc(c.customerId)}">Details</button>
        ${c.openPostRequests ? `<button class="btn btn-quiet btn-small" data-action="cancel-requests" data-id="${esc(c.customerId)}">${c.openPostRequests} offene Anfrage${c.openPostRequests === 1 ? "" : "n"} stornieren</button>` : ""}
        <button class="btn btn-quiet btn-small" data-action="extend" data-id="${esc(c.customerId)}">+7 Tage</button>
        ${!c.trial.unlimited ? `<button class="btn btn-quiet btn-small" data-action="unlimited" data-id="${esc(c.customerId)}">Unbefristet</button>` : ""}
        <button class="btn btn-quiet btn-small" data-action="toggle-status" data-id="${esc(c.customerId)}" data-status="${c.status === "active" ? "paused" : "active"}">${c.status === "active" ? "Pausieren" : "Aktivieren"}</button>
      </div></td>
    </tr>`;
  }

  function testEmailSectionHtml() {
    return `<div class="tool">
      <h2>Test-E-Mail senden</h2>
      <p class="muted small">Schickt eine echte Vorlage mit „[TEST]“ im Betreff an eine beliebige Adresse – so lässt sich der Mail-Versand prüfen, ohne einen echten Kunden zu behelligen.</p>
      <form id="test-email-form" class="tool-form">
        <div class="field" style="flex:1;min-width:220px">
          <label for="test-email-to">Ziel-Adresse</label>
          <input id="test-email-to" type="email" required placeholder="paul@beispiel.at">
        </div>
        <div class="field">
          <label for="test-email-template">Vorlage</label>
          <select id="test-email-template">
            <option value="approvals">Freigabe-Erinnerung</option>
            <option value="trial-ending">Testphase endet bald</option>
            <option value="first-post">Erster Beitrag live</option>
            <option value="verification">E-Mail-Bestätigung</option>
            <option value="weekly-report">Wöchentlicher Analytics-Bericht</option>
            <option value="token-expiring">Verbindung läuft bald ab</option>
          </select>
        </div>
        <button class="btn btn-primary" type="submit">Senden</button>
      </form>
      <p id="test-email-status" class="hint" aria-live="polite"></p>
    </div>`;
  }

  function renderDashboard() {
    $("#logout").hidden = false;
    $("#app").innerHTML = `
      <section class="section" aria-label="Lage">
        ${statusHtml(DATA.metrics)}
      </section>

      <section class="section" aria-labelledby="h-zahlen">
        <div class="section-head"><h2 id="h-zahlen">Zahlen</h2></div>
        <div class="metrics">${metricsHtml(DATA.metrics)}</div>
      </section>

      <section class="section" aria-labelledby="h-kunden">
        <div class="section-head"><h2 id="h-kunden">Kunden</h2><span class="muted small num">${DATA.customers.length}</span></div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Firma</th><th>Erstellt</th><th>Status</th><th>Testphase</th><th>Kanäle</th><th>Beiträge</th><th>Aktionen</th></tr></thead>
          <tbody>${DATA.customers.length ? DATA.customers.map(rowHtml).join("") : `<tr><td colspan="7" class="muted" style="text-align:center;padding:var(--s7) 0">Noch keine Kunden.</td></tr>`}</tbody>
        </table>
        </div>
      </section>

      <section class="section" aria-labelledby="h-werkzeuge">
        <div class="section-head"><h2 id="h-werkzeuge">Werkzeuge</h2></div>
        ${testEmailSectionHtml()}
        ${usageCostsHtml(DATA.usageCosts)}
      </section>`;
  }

  async function loadOverview() {
    $("#app").innerHTML = `<p class="loading">Wird geladen …</p>`;
    DATA = await api("GET", "/api/overview");
    renderDashboard();
  }

  async function showDetails(id) {
    const c = await api("GET", `/api/customers/${id}`);
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.id = "detail-overlay";
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(c.company)}">
      <div class="modal-head">
        <h2>${esc(c.company)}</h2>
        <button type="button" class="icon-btn close" aria-label="Schließen">${icon("close", 13)}</button>
      </div>
      <dl class="kv">
        <dt>Kontakt</dt><dd>${esc(c.contactName)} · ${esc(c.email)}</dd>
        <dt>Website</dt><dd>${esc(c.briefing.website || "–")}</dd>
        <dt>Branche</dt><dd>${esc(c.briefing.industry || "–")}</dd>
        <dt>Ton</dt><dd>${esc(c.briefing.tone || "–")}</dd>
        <dt>Rhythmus</dt><dd>${esc(c.briefing.frequency || "–")} um ${esc(c.briefing.postTime || "–")}</dd>
        <dt>CTA</dt><dd>${esc(c.briefing.ctaPreference || "–")}</dd>
        <dt>Worum es geht</dt><dd>${esc(c.briefing.about || "–")}</dd>
        <dt>Vermeiden</dt><dd>${esc(c.briefing.avoidTopics || "–")}</dd>
      </dl>
      <h2>Letzte Beiträge</h2>
      <ul class="posts-list">
        ${c.posts.length ? c.posts.map((p) => `<li><strong>${esc(p.headline || p.provider)}</strong><time>${fmtDateTime(p.postedAt)}</time>${p.caption ? `<div class="muted">${esc(p.caption.slice(0, 140))}${p.caption.length > 140 ? "…" : ""}</div>` : ""}</li>`).join("") : `<li class="muted">Noch keine Beiträge.</li>`}
      </ul>
    </div>`;
    const lastFocused = document.activeElement;
    const close = () => { ov.remove(); document.removeEventListener("keydown", onKey, true); if (lastFocused && lastFocused.focus) lastFocused.focus(); };
    const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); close(); } };
    ov.addEventListener("click", (e) => { if (e.target === ov || e.target.closest(".close")) close(); });
    document.addEventListener("keydown", onKey, true);
    document.body.append(ov);
    ov.querySelector(".close").focus();
  }

  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "test-email-form") return;
    e.preventDefault();
    const to = $("#test-email-to").value.trim();
    const template = $("#test-email-template").value;
    const status = $("#test-email-status");
    const btn = e.target.querySelector("button[type=submit]");
    btn.classList.add("busy");
    status.textContent = "";
    try {
      await api("POST", "/api/test-email", { to, template });
      status.textContent = `Verschickt an ${to}.`;
      status.style.color = "var(--go)";
    } catch (err) {
      status.textContent = err.message || "Versand fehlgeschlagen.";
      status.style.color = "var(--stop)";
    } finally {
      btn.classList.remove("busy");
    }
  });

  document.addEventListener("click", async (e) => {
    if (e.target.id === "logout") {
      await api("POST", "/api/logout");
      return boot();
    }
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    try {
      if (action === "details") return showDetails(id);
      if (action === "cancel-requests") {
        if (!(await showConfirm({ title: "Offene Anfragen stornieren?", message: "Der Kanal ist danach wieder frei. Bereits veröffentlichte Beiträge bleiben bestehen.", confirmLabel: "Stornieren" }))) return;
        btn.classList.add("busy");
        await api("POST", `/api/customers/${id}/cancel-requests`);
        await loadOverview();
      }
      if (action === "extend") {
        // Vorher window.prompt() - das war der letzte Systemdialog auf dieser Seite und sah
        // auf jedem Geraet anders aus als der Rest.
        const answer = await showPrompt({
          title: "Testphase verlängern",
          message: "Um wie viele Tage soll die Testphase dieses Kunden verlängert werden?",
          label: "Tage", value: "7", type: "number", inputmode: "numeric", min: "1",
          confirmLabel: "Verlängern",
        });
        if (answer === false) return;
        const days = Number(answer);
        if (!Number.isFinite(days) || days <= 0) return showError("Bitte eine Zahl größer als 0 eingeben.");
        btn.classList.add("busy");
        await api("POST", `/api/customers/${id}/extend-trial`, { days });
        await loadOverview();
      }
      if (action === "unlimited") {
        if (!(await showConfirm({ title: "Unbefristet freischalten?", message: "Dieser Kunde hat danach keinen Ablauf der Testphase mehr.", confirmLabel: "Freischalten" }))) return;
        btn.classList.add("busy");
        await api("POST", `/api/customers/${id}/unlimited`);
        await loadOverview();
      }
      if (action === "toggle-status") {
        const status = btn.dataset.status;
        if (status === "paused" && !(await showConfirm({ title: "Kunde pausieren?", message: "Es werden dann keine neuen Beiträge mehr veröffentlicht.", confirmLabel: "Pausieren", danger: true }))) return;
        btn.classList.add("busy");
        await api("POST", `/api/customers/${id}/status`, { status });
        await loadOverview();
      }
    } catch (err) {
      showError(err.message || "Aktion fehlgeschlagen.");
      btn.classList.remove("busy");
    }
  });

  /* ---------------- Boot ---------------- */
  async function boot() {
    try {
      await api("GET", "/api/me");
      await loadOverview();
    } catch {
      renderLogin();
    }
  }
  boot();
})();
</script>
</body>
</html>
