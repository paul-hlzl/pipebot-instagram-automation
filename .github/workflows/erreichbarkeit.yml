# Erreichbarkeit von AUSSEN (20.09.2026).
#
# Warum es das gibt: /root/scripts/health-check.sh laeuft auf genau der Maschine, die es
# ueberwacht. Es teilt sich deren Netz und deren DNS-Cache - und kann deshalb nie sagen, ob die
# Aussenwelt hereinkommt. Am 20.09. war der A-Record von mcp.pipebot.at ab 12:45 weg; der Check
# auf dem Server meldete um 13:00 noch "http=200", weil er den alten Eintrag im Cache hatte.
# Und faellt der Server ganz aus, kann er auch keine Alarmmail mehr schicken.
#
# Dieser Lauf startet bei GitHub, nicht bei uns. Er sieht genau das, was die Routine sieht.
# Gemeldet wird ueber ein GitHub-Issue: das verschickt die Benachrichtigung von selbst, es
# braucht also kein Mailkonto und kein Secret im Repository.
#
# 21.09.2026 - zwei Reparaturen, nachdem 27 von 27 Laeufen fehlgeschlagen sind:
#
# 1. URSACHE DER FEHLLAEUFE: Der Schritt "Wiederherstellung melden" brach jedes Mal ab mit
#    "failed to run git: fatal: not a git repository". Dieser Workflow checkt das Repository
#    bewusst nicht aus (er braucht keinen Code), aber `gh` ermittelt das Zielrepository aus dem
#    git-Remote im Arbeitsverzeichnis - und das ist auf dem Runner leer. Weil der Schritt bei
#    status == OK laeuft, scheiterte ausgerechnet jeder ERFOLGREICHE Lauf, und GitHub verschickte
#    jedes Mal eine "Lauf fehlgeschlagen"-Mail. Behoben durch GH_REPO weiter unten: damit braucht
#    `gh` kein Arbeitsverzeichnis mehr. Kein Checkout noetig.
#
# 2. MELDUNG NUR BEI ZUSTANDSWECHSEL: Vorher kommentierte ein anhaltender Ausfall das offene
#    Issue bei JEDEM Lauf - also alle 10 Minuten eine Mail. Jetzt gilt dieselbe Regel wie in
#    health-check.sh: eine Meldung beim Wechsel OK->AUSFALL, eine beim Wechsel AUSFALL->OK,
#    dazwischen Funkstille. Das offene Issue IST der Zustandsspeicher.
#
# GRUNDSATZ fuer kuenftige Aenderungen: Im Normalbetrieb darf dieser Workflow nicht fehlschlagen.
# Ein roter Lauf ist hier eine Mail. Der OK-Pfad meldet Pannen deshalb nur als Warnung; nur wenn
# ohnehin ein Ausfall vorliegt, darf der Lauf rot werden - dann ist die Mail erwuenscht.

name: Erreichbarkeit

on:
  schedule:
    # Alle 10 Minuten. GitHub haelt den Takt nur ungefaehr ein (oft ein paar Minuten spaeter) -
    # fuer eine Ausfallmeldung genuegt das. Das Repository ist oeffentlich, Minuten sind frei.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

# Zwei gleichzeitige Laeufe wuerden sich beim Anlegen des Issues in die Quere kommen.
concurrency:
  group: erreichbarkeit
  cancel-in-progress: false

env:
  ZIEL: https://mcp.pipebot.at/health
  NAME: mcp.pipebot.at
  ZONE: pipebot.at
  ERWARTETE_IP: 2.29.38.44
  MARKE: erreichbarkeit-ausfall      # Label, an dem der Lauf sein eigenes Issue wiedererkennt
  # Ohne das hier findet `gh` das Repository nicht, weil kein Checkout stattfindet. Siehe oben.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Von aussen pruefen
        id: pruefung
        run: |
          set -u
          gruende=""

          # 1. Zeigt der Name beim autoritativen Nameserver noch auf uns?
          #    Ohne Cache - genau die Pruefung, die am 20.09. gefehlt hat.
          ns="$(dig +short NS "$ZONE" 2>/dev/null | head -1)"
          if [ -n "$ns" ]; then
            ip="$(dig +short +time=5 +tries=2 @"$ns" "$NAME" A 2>/dev/null | grep -E '^[0-9.]+$' | tail -1)"
          else
            ip="$(dig +short "$NAME" A 2>/dev/null | grep -E '^[0-9.]+$' | tail -1)"
          fi
          if [ -z "$ip" ]; then
            gruende="${gruende}- DNS: ${NAME} hat beim autoritativen Nameserver KEINEN A-Record.\n"
          elif [ "$ip" != "$ERWARTETE_IP" ]; then
            gruende="${gruende}- DNS: ${NAME} zeigt auf ${ip} statt auf ${ERWARTETE_IP}.\n"
          fi

          # 2. Kommt eine echte Anfrage von aussen durch? Zweimal versuchen, damit ein
          #    einzelner Schluckauf bei GitHub keinen Fehlalarm ausloest.
          code=""
          for versuch in 1 2; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$ZIEL" || echo 000)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" != "200" ]; then
            gruende="${gruende}- HTTP: ${ZIEL} lieferte ${code} statt 200 (000 = gar keine Verbindung).\n"
          fi

          {
            echo "ip=${ip:-keiner}"
            echo "code=${code}"
            if [ -n "$gruende" ]; then
              echo "status=FAILED"
              echo "gruende<<ENDE"
              printf "%b" "$gruende"
              echo "ENDE"
            else
              echo "status=OK"
              echo "gruende<<ENDE"
              echo "ENDE"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Status: ${gruende:+FAILED}${gruende:-OK} | A-Record=${ip:-keiner} | HTTP=${code}"

      - name: Ausfall melden
        if: steps.pruefung.outputs.status == 'FAILED'
        run: |
          set -u
          # Das offene Issue ist der Zustandsspeicher. Gibt es schon eins, LAEUFT der Ausfall
          # bereits - dann bleibt es still. Sonst kaeme alle 10 Minuten eine Mail.
          offen="$(gh issue list --label "$MARKE" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$offen" ]; then
            echo "Ausfall haelt an, Issue #${offen} ist bereits offen - keine weitere Meldung."
            exit 0
          fi

          # Das Label muss existieren, sonst lehnt `gh issue create` den Aufruf ab und die
          # Ausfallmeldung ginge verloren. Anlegen ist folgenlos, wenn es schon da ist.
          gh label create "$MARKE" \
            --color B60205 \
            --description "Offener Ausfall laut Workflow Erreichbarkeit" \
            2>/dev/null || true

          text="$(printf 'Der Dienst ist von aussen nicht erreichbar.\n\nGeprueft: %s (UTC)\nA-Record laut autoritativem NS: %s (erwartet: %s)\nHTTP-Status: %s\n\nGefunden:\n%b\nDieser Lauf startet bei GitHub, nicht auf dem Server - er sieht also, was die Routine sieht.\n\nSolange der Ausfall anhaelt, kommt KEINE weitere Meldung: dieses Issue bleibt einfach offen. Es schliesst sich von selbst, sobald der naechste Lauf wieder durchkommt - das ist dann die zweite und letzte Mail zu diesem Vorfall.' \
            "$(date -u +'%Y-%m-%d %H:%M:%S')" "${{ steps.pruefung.outputs.ip }}" "$ERWARTETE_IP" "${{ steps.pruefung.outputs.code }}" "${{ steps.pruefung.outputs.gruende }}")"

          gh issue create \
            --title "Ausfall: mcp.pipebot.at von aussen nicht erreichbar" \
            --label "$MARKE" \
            --body "$text"

      - name: Wiederherstellung melden
        if: steps.pruefung.outputs.status == 'OK'
        run: |
          set -u
          # ACHTUNG: Dieser Schritt laeuft bei JEDEM erfolgreichen Lauf, also rund 144x am Tag.
          # Faellt er aus, verschickt GitHub 144 Fehlermails - genau das ist am 21.09. passiert.
          # Deshalb wird hier nichts als Fehler gewertet: Pannen erscheinen als Warnung im Lauf,
          # der Lauf selbst bleibt gruen.
          if ! offen="$(gh issue list --label "$MARKE" --state open --json number --jq '.[0].number // empty' 2>&1)"; then
            echo "::warning::Offene Ausfall-Issues konnten nicht abgefragt werden: ${offen}"
            exit 0
          fi

          if [ -z "$offen" ]; then
            echo "Alles in Ordnung, kein offener Ausfall - keine Meldung."
            exit 0
          fi

          # Zustandswechsel AUSFALL -> OK: genau hier gehoert die Entwarnung hin.
          if gh issue close "$offen" \
               --comment "Wieder erreichbar: A-Record ${{ steps.pruefung.outputs.ip }}, HTTP ${{ steps.pruefung.outputs.code }} ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)."; then
            echo "Entwarnung: Issue #${offen} geschlossen."
          else
            echo "::warning::Issue #${offen} konnte nicht geschlossen werden - naechster Lauf versucht es erneut."
          fi
